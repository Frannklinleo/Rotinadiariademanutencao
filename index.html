const { useState, useMemo, useRef, useEffect } = React;

// ----------------------------------------------------------------------------
// Ícones (mapeados a partir do build UMD do lucide, expostos em window.lucide.icons
// como componentes prontos via lucide.createElement, então criamos wrappers React)
// ----------------------------------------------------------------------------
function makeIcon(name) {
  return function Icon({ size = 16, strokeWidth = 2, color, style, className }) {
    const ref = useRef(null);
    useEffect(() => {
      if (!ref.current) return;
      ref.current.innerHTML = "";
      try {
        const iconNode = window.lucide && window.lucide.icons && window.lucide.icons[name];
        if (!iconNode) return;
        const svgEl = window.lucide.createElement(iconNode, {
          width: size,
          height: size,
          "stroke-width": strokeWidth,
          ...(color ? { stroke: color } : {}),
        });
        svgEl.style.display = "block";
        ref.current.appendChild(svgEl);
      } catch (e) {
        // Ícone indisponível nesta versão do lucide; falha silenciosa (não bloqueia o app)
      }
    }, [size, strokeWidth, color]);
    return <span ref={ref} className={className} style={{ display: "inline-flex", color, ...style }} />;
  };
}

const supaHeaders = {
  "Content-Type": "application/json",
  "apikey": SUPA_KEY,
  "Authorization": `Bearer ${SUPA_KEY}`,
  "Prefer": "return=representation",
};

async function supaFetch(path, opts = {}) {
  const res = await fetch(`${SUPA_URL}/rest/v1${path}`, {
    ...opts,
    headers: { ...supaHeaders, ...(opts.headers || {}) },
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(`Supabase error ${res.status}: ${err}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// Busca usuário por nome+sobrenome, retorna null se não existir
async function supaGetUsuario(nome, sobrenome) {
  const rows = await supaFetch(
    `/usuarios?nome=eq.${encodeURIComponent(nome)}&sobrenome=eq.${encodeURIComponent(sobrenome)}&limit=1`
  );
  return rows && rows.length > 0 ? rows[0] : null;
}

// Busca usuário pelo login (case-insensitive) — usado no novo fluxo de entrada
async function supaGetUsuarioPorLogin(login) {
  const rows = await supaFetch(
    `/usuarios?login=ilike.${encodeURIComponent(login.trim())}&limit=1`
  );
  return rows && rows.length > 0 ? rows[0] : null;
}

// Busca usuário pelo e-mail (case-insensitive) — usado na recuperação de senha
async function supaGetUsuarioPorEmail(email) {
  const rows = await supaFetch(
    `/usuarios?email=ilike.${encodeURIComponent(email.trim())}&limit=1`
  );
  return rows && rows.length > 0 ? rows[0] : null;
}

// Verifica se um usuário ainda existe no banco pelo id (usado para detectar
// sessões "órfãs" — quando o banco foi resetado mas o celular ainda guarda o id antigo)
async function supaVerificarUsuarioExiste(id) {
  if (!id) return false;
  try {
    const rows = await supaFetch(`/usuarios?id=eq.${id}&select=id&limit=1`);
    return !!(rows && rows.length > 0);
  } catch (_) {
    return true; // erro de rede: não desloga por precaução, assume que existe
  }
}

// Cria usuário novo, retorna o registro criado
async function supaCreateUsuario(nome, sobrenome, login, senha, email) {
  const rows = await supaFetch("/usuarios", {
    method: "POST",
    body: JSON.stringify({ nome, sobrenome, login, senha, email }),
  });
  return rows && rows.length > 0 ? rows[0] : null;
}

// ── Recuperação de senha via e-mail real (usa o Supabase Auth só para o envio) ──
// Cada usuário do nosso sistema de PIN customizado também ganha uma conta "espelho"
// no Supabase Auth (mesmo e-mail, senha aleatória interna) só para poder receber
// o e-mail de redefinição pronto do Supabase. O PIN do nosso app é sempre o que vale.
async function supaEnviarEmailRecuperacao(email) {
  const res = await fetch(`${SUPA_URL}/auth/v1/recover`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPA_KEY },
    body: JSON.stringify({ email: email.trim() }),
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(`Falha ao enviar e-mail (${res.status}): ${err}`);
  }
  return true;
}

// Garante que existe uma conta espelho no Supabase Auth para esse e-mail
// (necessário para o /auth/v1/recover conseguir encontrar alguém a quem mandar o e-mail)
async function supaGarantirContaAuth(email, senhaInterna) {
  try {
    await fetch(`${SUPA_URL}/auth/v1/signup`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPA_KEY },
      body: JSON.stringify({ email: email.trim(), password: senhaInterna }),
    });
  } catch (_) {
    // Falha aqui não deve travar o cadastro principal — a recuperação de senha
    // é um recurso adicional, não o cadastro em si.
  }
}

// Upsert de um registro de área (por usuario_id + tipo_rotina + data + area_id)
async function supaUpsertRegistro(registro) {
  const onConflict = "usuario_id,tipo_rotina,data,area_id";
  return supaFetch(`/registros_diarios?on_conflict=${onConflict}`, {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=representation" },
    body: JSON.stringify(registro),
  });
}

// Registra uma anomalia confirmada pelo usuário (pop-up Sim/Não na observação da área)
async function supaRegistrarAnomalia(anomalia) {
  return supaFetch("/anomalias", {
    method: "POST",
    headers: { "Prefer": "return=representation" },
    body: JSON.stringify(anomalia),
  });
}

// Busca a contagem de anomalias de um usuário num período (para o Dashboard pessoal)
async function supaGetAnomaliasUsuario(usuarioId, diasAtras = 30) {
  const de = new Date();
  de.setDate(de.getDate() - diasAtras);
  const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  return supaFetch(`/anomalias?usuario_id=eq.${usuarioId}&data=gte.${fmt(de)}&order=data.desc`);
}

// Busca todas as anomalias de todos os usuários num período (para o Dashboard geral)
async function supaGetTodasAnomalias(diasAtras = 30) {
  const de = new Date();
  de.setDate(de.getDate() - diasAtras);
  const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  return supaFetch(`/anomalias?data=gte.${fmt(de)}&order=criado_em.desc`);
}

async function supaGetRegistrosDia(dataISO) {
  return supaFetch(`/registros_diarios?data=eq.${dataISO}&order=usuario_nome.asc,tipo_rotina.asc,area_id.asc`);
}

// Busca histórico dos últimos N dias (todos os usuários)
async function supaGetHistorico(diasAtras = 30) {
  const ate = new Date();
  const de = new Date();
  de.setDate(de.getDate() - diasAtras);
  const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  return supaFetch(`/registros_diarios?data=gte.${fmt(de)}&data=lte.${fmt(ate)}&order=data.desc,usuario_nome.asc`);
}

// Upload de avatar para o Supabase Storage
async function supaUploadAvatar(userId, file) {
  const ext = file.name.split(".").pop() || "jpg";
  const path = `${userId}.${ext}`;
  const res = await fetch(`${SUPA_URL}/storage/v1/object/avatars/${path}`, {
    method: "POST",
    headers: {
      "apikey": SUPA_KEY,
      "Authorization": `Bearer ${SUPA_KEY}`,
      "Content-Type": file.type,
      "x-upsert": "true",
    },
    body: file,
  });
  if (!res.ok) {
    let detalhe = "";
    try { detalhe = await res.text(); } catch (_) {}
    throw new Error(`Upload falhou (${res.status}): ${detalhe || "verifique se o bucket 'avatars' existe e é público"}`);
  }
  return `${SUPA_URL}/storage/v1/object/public/avatars/${path}?t=${Date.now()}`;
}

function totalItensDe(areas) {
  return areas.reduce((acc, a) => acc + a.itens.length, 0);
}

// Um item de checklist pode ser uma string simples (checkbox) ou um objeto
// estruturado { label, campos: [{ id, label, tipo, ... }] } com inputs/selects.
// Esta função decide, para os dois formatos, se o item já está "completo".
function itemEstaCompleto(item, idx, status) {
  if (typeof item === "string") {
    return !!(status && status.checkedItems && status.checkedItems[idx]);
  }
  const valores = (status && status.valores) || {};
  return item.campos.every((c) => (valores[c.id] || "").toString().trim().length > 0);
}

function formatarDataLonga(d) {
  const dias = [
    "domingo",
    "segunda-feira",
    "terça-feira",
    "quarta-feira",
    "quinta-feira",
    "sexta-feira",
    "sábado",
  ];
  const meses = [
    "janeiro",
    "fevereiro",
    "março",
    "abril",
    "maio",
    "junho",
    "julho",
    "agosto",
    "setembro",
    "outubro",
    "novembro",
    "dezembro",
  ];
  return `${dias[d.getDay()]}, ${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
}

function formatarDataCurta(d) {
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const yyyy = d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

function chaveDoDia(d, tipoRotina) {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `rotina:${tipoRotina}:${yyyy}-${mm}-${dd}`;
}

// Atividades não rotineiras são registradas por dia, independente da rotina (mecânica/elétrica) ativa
function chaveAtividades(d) {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `atividades:${yyyy}-${mm}-${dd}`;
}

function estadoInicial(areas) {
  const initial = {};
  areas.forEach((a) => {
    initial[a.id] = {
      checkedItems: new Array(a.itens.length).fill(false),
      valores: {},
      comentario: "",
      isAnomalia: null, // null = ainda não perguntado, true/false = resposta do usuário
      savedAt: null,
    };
  });
  return initial;
}

// Garante que todo status carregado do storage tenha exatamente as áreas e o formato
// esperados pela rotina atual, mesmo que os dados salvos sejam de uma versão antiga
// ou de uma rotina com áreas diferentes.
function sanitizarStatus(raw, areas) {
  const base = estadoInicial(areas);
  if (!raw || typeof raw !== "object") return base;
  areas.forEach((a) => {
    const salvo = raw[a.id];
    if (!salvo || typeof salvo !== "object") return;
    const checkedItemsSalvos = Array.isArray(salvo.checkedItems) ? salvo.checkedItems : [];
    const checkedItems = a.itens.map((_, idx) => !!checkedItemsSalvos[idx]);
    const valoresSalvos = salvo.valores && typeof salvo.valores === "object" ? salvo.valores : {};
    base[a.id] = {
      checkedItems,
      valores: { ...valoresSalvos },
      comentario: typeof salvo.comentario === "string" ? salvo.comentario : "",
      isAnomalia: typeof salvo.isAnomalia === "boolean" ? salvo.isAnomalia : null,
      savedAt: typeof salvo.savedAt === "number" ? salvo.savedAt : null,
    };
  });
  return base;
}

// ----------------------------------------------------------------------------
// COMPONENTE: anel de progresso (SVG)
// ----------------------------------------------------------------------------

function ProgressRing({ progress, size = 44, stroke = 4, color = "#F5A623", track = "rgba(255,255,255,0.08)" }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - progress * c;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="shrink-0">
      <circle cx={size / 2} cy={size / 2} r={r} stroke={track} strokeWidth={stroke} fill="none" />
      <circle
        cx={size / 2}
        cy={size / 2}
        r={r}
        stroke={color}
        strokeWidth={stroke}
        fill="none"
        strokeLinecap="round"
        strokeDasharray={c}
        strokeDashoffset={offset}
        transform={`rotate(-90 ${size / 2} ${size / 2})`}
        style={{ transition: "stroke-dashoffset 400ms cubic-bezier(0.4,0,0.2,1)" }}
      />
    </svg>
  );
}

function TelaPerfil({ usuario, onAtualizarUsuario, tema, p, modoTema, onMudarModoTema }) {
  const [fotoCarregando, setFotoCarregando] = useState(false);
  const [alterandoSenha, setAlterandoSenha] = useState(false);
  const [senhaAtual, setSenhaAtual] = useState("");
  const [novaSenha, setNovaSenha] = useState("");
  const [confirmarNovaSenha, setConfirmarNovaSenha] = useState("");
  const [msgSenha, setMsgSenha] = useState(null); // { tipo: "ok"|"erro", texto }
  const [mostrarSenhas, setMostrarSenhas] = useState(false);
  const [metricas, setMetricas] = useState(null);
  const fileRef = useRef(null);

  // Busca métricas pessoais do usuário (incluindo anomalias registradas)
  useEffect(() => {
    if (!usuario || !usuario.id) return;
    async function carregar() {
      try {
        const dados = await supaGetHistorico(30);
        const meus = (dados || []).filter((r) => r.usuario_id === usuario.id);
        const diasSet = new Set(meus.map((r) => r.data));
        const totalCheck = meus.reduce((a, r) => a + (r.checked_items ? r.checked_items.filter(Boolean).length : 0), 0);
        const totalItens = meus.reduce((a, r) => a + (r.checked_items ? r.checked_items.length : 0), 0);

        let anomalias7 = 0, anomalias30 = 0;
        try {
          const minhasAnomalias = await supaGetAnomaliasUsuario(usuario.id, 30);
          const seteDiasAtras = new Date();
          seteDiasAtras.setDate(seteDiasAtras.getDate() - 7);
          const seteDiasISO = `${seteDiasAtras.getFullYear()}-${String(seteDiasAtras.getMonth()+1).padStart(2,"0")}-${String(seteDiasAtras.getDate()).padStart(2,"0")}`;
          anomalias30 = (minhasAnomalias || []).length;
          anomalias7 = (minhasAnomalias || []).filter((a) => a.data >= seteDiasISO).length;
        } catch (_) {}

        setMetricas({
          diasAtivos: diasSet.size,
          totalCheck,
          totalItens,
          percentual: totalItens ? Math.round((totalCheck / totalItens) * 100) : 0,
          anomalias7,
          anomalias30,
        });
      } catch (_) {}
    }
    carregar();
  }, [usuario]);

  async function handleFoto(e) {
    const file = e.target.files && e.target.files[0];
    if (!file || !usuario || !usuario.id) {
      if (usuario && !usuario.id) {
        alert("Sua sessão não está sincronizada com o servidor. Saia e entre novamente antes de enviar uma foto.");
      }
      return;
    }
    setFotoCarregando(true);
    try {
      const url = await supaUploadAvatar(usuario.id, file);
      await supaAtualizarFotoUrl(usuario.id, url);
      const atualizado = { ...usuario, foto_url: url };
      localStorage.setItem("usuario_sessao", JSON.stringify(atualizado));
      onAtualizarUsuario(atualizado);
    } catch (err) {
      alert(`Erro ao enviar foto: ${err && err.message ? err.message : "tente novamente"}`);
    }
    setFotoCarregando(false);
    e.target.value = "";
  }

  async function handleAlterarSenha() {
    setMsgSenha(null);

    if (novaSenha.length !== 4 || !/^\d{4}$/.test(novaSenha)) {
      setMsgSenha({ tipo: "erro", texto: "Nova senha deve ter 4 dígitos." }); return;
    }
    if (novaSenha !== confirmarNovaSenha) {
      setMsgSenha({ tipo: "erro", texto: "As senhas não coincidem." }); return;
    }

    // Valida a senha atual contra o Supabase (fonte da verdade), com fallback local
    let senhaValida = false;
    try {
      const usuarioDb = await supaGetUsuario(usuario.nome, usuario.sobrenome);
      if (usuarioDb) {
        senhaValida = senhaAtual === usuarioDb.senha;
      } else {
        const salvo = JSON.parse(localStorage.getItem("usuario_rotina") || "null");
        senhaValida = !!salvo && senhaAtual === salvo.senha;
      }
    } catch (_) {
      const salvo = JSON.parse(localStorage.getItem("usuario_rotina") || "null");
      senhaValida = !!salvo && senhaAtual === salvo.senha;
    }

    if (!senhaValida) {
      setMsgSenha({ tipo: "erro", texto: "Senha atual incorreta." }); return;
    }

    try {
      if (usuario.id) await supaAtualizarSenha(usuario.id, novaSenha);
      const salvoAtual = JSON.parse(localStorage.getItem("usuario_rotina") || "null") || { nome: usuario.nome, sobrenome: usuario.sobrenome };
      localStorage.setItem("usuario_rotina", JSON.stringify({ ...salvoAtual, senha: novaSenha }));
      setMsgSenha({ tipo: "ok", texto: "Senha alterada com sucesso!" });
      setSenhaAtual(""); setNovaSenha(""); setConfirmarNovaSenha("");
      setAlterandoSenha(false);
    } catch (_) {
      setMsgSenha({ tipo: "erro", texto: "Erro ao salvar nova senha no servidor. Tente novamente." });
    }
  }

  const inputStyle = {
    background: p.superficieAlt,
    border: `1px solid ${p.bordaForte}`,
    color: p.texto, outline: "none", borderRadius: "12px",
    padding: "10px 14px", fontSize: "14px", width: "100%",
  };

  return (
    <div className="flex flex-col gap-4 pb-8">
      {/* Avatar */}
      <div
        className="flex flex-col items-center gap-3 rounded-3xl p-6"
        style={{ background: p.superficie, border: `1px solid ${p.borda}`, boxShadow: p === PALETA.claro ? "0 2px 8px rgba(23,23,23,0.06)" : "none" }}
      >
        <div className="relative">
          <div
            className="flex h-20 w-20 items-center justify-center overflow-hidden rounded-3xl"
            style={{ background: tema.accentSoft, border: `2px solid ${tema.accentBorder}` }}
          >
            {fotoCarregando
              ? <div className="text-[11px]" style={{ color: tema.accent }}>...</div>
              : (usuario && usuario.foto_url)
                ? <img src={usuario.foto_url} alt="" className="h-full w-full object-cover" />
                : <span className="text-[28px] font-bold" style={{ color: tema.accent }}>
                    {(usuario && usuario.nome ? usuario.nome[0].toUpperCase() : "?") || "?"}
                  </span>
            }
          </div>
          <button
            onClick={() => fileRef.current && fileRef.current.click()}
            className="absolute -bottom-1 -right-1 flex h-7 w-7 items-center justify-center rounded-full"
            style={{ background: tema.gradient, color: "#FFFFFF" }}
          >
            <Camera size={13} strokeWidth={2.5} />
          </button>
          <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFoto} />
        </div>
        <div className="text-center">
          <h2 className="text-[18px] font-bold" style={{ color: p.texto }}>{usuario ? usuario.nome : ""} {usuario ? usuario.sobrenome : ""}</h2>
          <p className="text-[12px]" style={{ color: p.textoTerciario }}>Equipe de Manutenção</p>
        </div>
      </div>

      {/* Métricas pessoais */}
      {metricas && (
        <div
          className="rounded-3xl p-5"
          style={{ background: p.superficie, border: `1px solid ${p.borda}`, boxShadow: p === PALETA.claro ? "0 2px 8px rgba(23,23,23,0.06)" : "none" }}
        >
          <h3 className="mb-4 text-[13px] font-semibold uppercase tracking-wider" style={{ color: p.textoTerciario }}>
            Últimos 30 dias
          </h3>
          <div className="grid grid-cols-3 gap-3">
            {[
              { label: "Dias ativos", valor: metricas.diasAtivos },
              { label: "Itens feitos", valor: metricas.totalCheck },
              { label: "Taxa geral", valor: `${metricas.percentual}%` },
            ].map(({ label, valor }) => (
              <div
                key={label}
                className="flex flex-col items-center gap-1 rounded-2xl py-3"
                style={{ background: p.superficieAlt }}
              >
                <span className="text-[22px] font-bold" style={{ color: tema.accent }}>{valor}</span>
                <span className="text-center text-[10px] leading-tight" style={{ color: p.textoTerciario }}>{label}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Anomalias identificadas — indicador de atenção durante inspeções, não um ranking */}
      {metricas && (
        <div
          className="rounded-3xl p-5"
          style={{ background: p.superficie, border: `1px solid ${p.borda}`, boxShadow: p === PALETA.claro ? "0 2px 8px rgba(23,23,23,0.06)" : "none" }}
        >
          <h3 className="mb-1 text-[13px] font-semibold uppercase tracking-wider" style={{ color: p.textoTerciario }}>
            Anomalias identificadas
          </h3>
          <p className="mb-4 text-[11.5px]" style={{ color: p.textoTerciario }}>
            Observações confirmadas como anomalia durante suas inspeções
          </p>
          <div className="grid grid-cols-2 gap-3">
            {[
              { label: "Últimos 7 dias", valor: metricas.anomalias7 },
              { label: "Últimos 30 dias", valor: metricas.anomalias30 },
            ].map(({ label, valor }) => (
              <div
                key={label}
                className="flex flex-col items-center gap-1 rounded-2xl py-3"
                style={{ background: p.alertaSoft }}
              >
                <span className="text-[22px] font-bold" style={{ color: p.alerta }}>{valor}</span>
                <span className="text-center text-[10px] leading-tight" style={{ color: p.textoTerciario }}>{label}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Alterar senha */}
      <div
        className="rounded-3xl p-5"
        style={{ background: p.superficie, border: `1px solid ${p.borda}`, boxShadow: p === PALETA.claro ? "0 2px 8px rgba(23,23,23,0.06)" : "none" }}
      >
        <div className="mb-4 flex items-center justify-between">
          <h3 className="text-[13px] font-semibold uppercase tracking-wider" style={{ color: p.textoTerciario }}>
            Segurança
          </h3>
          <button
            onClick={() => setAlterandoSenha(!alterandoSenha)}
            className="rounded-xl px-3 py-1.5 text-[12px] font-medium"
            style={{ background: tema.accentSoft, color: tema.accent }}
          >
            {alterandoSenha ? "Cancelar" : "Alterar PIN"}
          </button>
        </div>

        {alterandoSenha && (
          <div className="flex flex-col gap-3">
            {[
              { label: "PIN atual", val: senhaAtual, set: setSenhaAtual },
              { label: "Novo PIN (4 dígitos)", val: novaSenha, set: setNovaSenha },
              { label: "Confirmar novo PIN", val: confirmarNovaSenha, set: setConfirmarNovaSenha },
            ].map(({ label, val, set }) => (
              <div key={label}>
                <label className="mb-1 block text-[11px]" style={{ color: p.textoTerciario }}>{label}</label>
                <div className="relative">
                  <input
                    type={mostrarSenhas ? "text" : "password"}
                    inputMode="numeric"
                    maxLength={4}
                    value={val}
                    onChange={(e) => set(e.target.value.replace(/\D/g, "").slice(0, 4))}
                    style={{ ...inputStyle, paddingRight: "40px" }}
                    placeholder="••••"
                  />
                  <button
                    type="button"
                    onClick={() => setMostrarSenhas(!mostrarSenhas)}
                    className="absolute right-3 top-1/2 -translate-y-1/2 text-[11px] font-medium"
                    style={{ color: p.textoTerciario }}
                  >
                    {mostrarSenhas ? "Ocultar" : "Ver"}
                  </button>
                </div>
              </div>
            ))}

            {msgSenha && (
              <p className="text-[12px]" style={{ color: msgSenha.tipo === "ok" ? p.sucesso : p.alerta }}>
                {msgSenha.texto}
              </p>
            )}

            <button
              onClick={handleAlterarSenha}
              className="w-full rounded-2xl py-3 text-[14px] font-semibold"
              style={{ background: tema.gradient, color: "#FFFFFF" }}
            >
              Salvar novo PIN
            </button>
          </div>
        )}

        {!alterandoSenha && (
          <p className="text-[13px]" style={{ color: p.textoSecundario }}>
            PIN de 4 dígitos configurado ✓
          </p>
        )}
      </div>

      {/* Aparência */}
      <div
        className="rounded-3xl p-5"
        style={{ background: p.superficie, border: `1px solid ${p.borda}`, boxShadow: p === PALETA.claro ? "0 2px 8px rgba(23,23,23,0.06)" : "none" }}
      >
        <h3 className="mb-4 text-[13px] font-semibold uppercase tracking-wider" style={{ color: p.textoTerciario }}>
          Aparência
        </h3>
        <div className="flex rounded-2xl p-1" style={{ background: p.superficieAlt }}>
          {[
            { valor: "claro", label: "Claro" },
            { valor: "escuro", label: "Escuro" },
          ].map(({ valor, label }) => (
            <button
              key={valor}
              onClick={() => onMudarModoTema(valor)}
              className="flex-1 rounded-xl py-2.5 text-[13px] font-medium transition-all"
              style={{
                background: modoTema === valor ? tema.gradient : "transparent",
                color: modoTema === valor ? "#FFFFFF" : p.textoTerciario,
              }}
            >
              {label}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// MODAL: EDITAR USUÁRIO (uso administrativo)

function ModalEditarUsuario({ usuarioAlvo, onClose, onSalvo, tema, p }) {
  const [nome, setNome] = useState(usuarioAlvo.nome);
  const [sobrenome, setSobrenome] = useState(usuarioAlvo.sobrenome);
  const [salvando, setSalvando] = useState(false);
  const [enviandoFoto, setEnviandoFoto] = useState(false);
  const [fotoUrl, setFotoUrl] = useState(usuarioAlvo.foto_url || null);
  const [erro, setErro] = useState(null);
  const fileRef = useRef(null);

  async function handleFoto(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setEnviandoFoto(true);
    setErro(null);
    try {
      const url = await supaUploadAvatar(usuarioAlvo.id, file);
      await supaAtualizarFotoUrl(usuarioAlvo.id, url);
      setFotoUrl(url);
    } catch (err) {
      setErro(`Erro ao enviar foto: ${err && err.message ? err.message : "tente novamente"}`);
    }
    setEnviandoFoto(false);
    e.target.value = "";
  }

  async function handleSalvar() {
    if (!nome.trim() || !sobrenome.trim()) { setErro("Nome e sobrenome não podem ficar vazios."); return; }
    setSalvando(true);
    setErro(null);
    try {
      await supaAtualizarDadosUsuario(usuarioAlvo.id, nome.trim(), sobrenome.trim());
      onSalvo({ ...usuarioAlvo, nome: nome.trim(), sobrenome: sobrenome.trim(), foto_url: fotoUrl });
    } catch (err) {
      setErro(`Erro ao salvar: ${err && err.message ? err.message : "tente novamente"}`);
      setSalvando(false);
    }
  }

  const inputStyle = {
    background: p.superficieAlt, border: `1px solid ${p.bordaForte}`,
    color: p.texto, outline: "none", borderRadius: "12px", padding: "10px 14px",
    fontSize: "14px", width: "100%",
  };

  return (
    <div
      className="fixed inset-0 z-50 flex items-center justify-center p-5"
      style={{ background: p.overlay, backdropFilter: "blur(8px)" }}
      onClick={onClose}
    >
      <div
        className="w-full max-w-sm rounded-3xl p-6"
        style={{ background: p.superficie, border: `1px solid ${p.borda}`, boxShadow: p === PALETA.claro ? "0 16px 48px rgba(23,23,23,0.2)" : "none" }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="mb-5 flex items-center justify-between">
          <h2 className="text-[16px] font-bold" style={{ color: p.texto }}>Editar usuário</h2>
          <button onClick={onClose} className="flex h-8 w-8 items-center justify-center rounded-xl" style={{ background: p.superficieAlt }}>
            <X size={15} color={p.textoSecundario} />
          </button>
        </div>

        {/* Foto */}
        <div className="mb-5 flex flex-col items-center gap-2">
          <div className="relative">
            <div
              className="flex h-20 w-20 items-center justify-center overflow-hidden rounded-3xl"
              style={{ background: tema.accentSoft, border: `2px solid ${tema.accentBorder}` }}
            >
              {enviandoFoto
                ? <span className="text-[11px]" style={{ color: tema.accent }}>...</span>
                : fotoUrl
                  ? <img src={fotoUrl} alt="" className="h-full w-full object-cover" />
                  : <span className="text-[28px] font-bold" style={{ color: tema.accent }}>{nome[0] ? nome[0].toUpperCase() : "?"}</span>
              }
            </div>
            <button
              onClick={() => fileRef.current && fileRef.current.click()}
              className="absolute -bottom-1 -right-1 flex h-7 w-7 items-center justify-center rounded-full"
              style={{ background: tema.gradient, color: "#FFFFFF" }}
            >
              <Camera size={13} strokeWidth={2.5} />
            </button>
            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFoto} />
          </div>
        </div>

        {/* Campos */}
        <div className="mb-4 flex flex-col gap-3">
          <div>
            <label className="mb-1 block text-[11px]" style={{ color: p.textoTerciario }}>Nome</label>
            <input type="text" value={nome} onChange={(e) => setNome(e.target.value)} style={inputStyle} />
          </div>
          <div>
            <label className="mb-1 block text-[11px]" style={{ color: p.textoTerciario }}>Sobrenome</label>
            <input type="text" value={sobrenome} onChange={(e) => setSobrenome(e.target.value)} style={inputStyle} />
          </div>
        </div>

        {erro && (
          <p className="mb-3 text-[12px]" style={{ color: p.alerta }}>{erro}</p>
        )}

        <button
          onClick={handleSalvar}
          disabled={salvando}
          className="w-full rounded-2xl py-3 text-[14px] font-semibold"
          style={{ background: tema.gradient, color: "#FFFFFF", opacity: salvando ? 0.6 : 1 }}
        >
          {salvando ? "Salvando..." : "Salvar alterações"}
        </button>
      </div>
    </div>
  );
}

function TelaDashboard({ tema, today, usuario, onEditarUsuario, refreshKey, p }) {
  const ehAdmin = !!(usuario && usuario.role === "admin");
  const [dados, setDados] = useState(null);
  const [carregando, setCarregando] = useState(true);
  const [periodo, setPeriodo] = useState(7); // 7 ou 30 dias

  useEffect(() => {
    async function carregar() {
      setCarregando(true);
      try {
        const registros = await supaGetHistorico(periodo);
        const usuarios = await supaGetTodosUsuarios();
        const anomalias = await supaGetTodasAnomalias(periodo);
        setDados({ registros: registros || [], usuarios: usuarios || [], anomalias: anomalias || [] });
      } catch (_) {
        setDados({ registros: [], usuarios: [], anomalias: [] });
      }
      setCarregando(false);
    }
    carregar();
  }, [periodo, refreshKey]);

  if (carregando) {
    return (
      <div className="flex flex-col items-center gap-3 py-16">
        <div className="text-[13px]" style={{ color: p.textoTerciario }}>Carregando dados...</div>
      </div>
    );
  }

  const { registros, usuarios, anomalias } = dados;

  // ── Métricas gerais ──────────────────────────────────────────────────────
  const totalChecked = registros.reduce((a, r) => a + (r.checked_items ? r.checked_items.filter(Boolean).length : 0), 0);
  const totalItens   = registros.reduce((a, r) => a + (r.checked_items ? r.checked_items.length : 0), 0);
  const taxaGeral    = totalItens ? Math.round((totalChecked / totalItens) * 100) : 0;
  const diasComDados = new Set(registros.map((r) => r.data)).size;

  // ── Progresso por usuário (hoje) ─────────────────────────────────────────
  const hoje = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
  const registrosHoje = registros.filter((r) => r.data === hoje);
  const porUsuarioHoje = {};
  registrosHoje.forEach((r) => {
    if (!porUsuarioHoje[r.usuario_nome]) porUsuarioHoje[r.usuario_nome] = { checked: 0, total: 0, rotinas: new Set() };
    porUsuarioHoje[r.usuario_nome].checked += r.checked_items ? r.checked_items.filter(Boolean).length : 0;
    porUsuarioHoje[r.usuario_nome].total   += r.checked_items ? r.checked_items.length : 0;
    porUsuarioHoje[r.usuario_nome].rotinas.add(r.tipo_rotina);
  });

  // ── Progresso diário (últimos N dias) ────────────────────────────────────
  const porDia = {};
  registros.forEach((r) => {
    if (!porDia[r.data]) porDia[r.data] = { checked: 0, total: 0 };
    porDia[r.data].checked += r.checked_items ? r.checked_items.filter(Boolean).length : 0;
    porDia[r.data].total   += r.checked_items ? r.checked_items.length : 0;
  });
  const diasOrdenados = Object.keys(porDia).sort().slice(-periodo);
  const maxBarDia = Math.max(...diasOrdenados.map((d) => porDia[d].total), 1);

  // ── Indicadores de equipamentos ──────────────────────────────────────────
  const valoresEq = {};
  registros.forEach((r) => {
    const v = r.valores || {};
    Object.entries(v).forEach(([k, val]) => {
      if (!valoresEq[k]) valoresEq[k] = [];
      if (val && val.toString().trim()) valoresEq[k].push({ data: r.data, val: parseFloat(val) || val });
    });
  });

  // Queimadores: temperatura média
  const queimadoresTemp = [1,2,3].map((n) => {
    const chave = `queimador${n}_temp`;
    const leituras = (valoresEq[chave] || []).filter((x) => !isNaN(x.val));
    const media = leituras.length ? Math.round(leituras.reduce((a,x) => a + x.val, 0) / leituras.length) : null;
    return { nome: `Q${n}`, media, leituras };
  });

  // Bombas de vácuo: status mais recente
  const bombasStatus = [1,2,3,4,5].map((n) => {
    const chave = `bombavacuo${n}_status`;
    const leituras = valoresEq[chave] || [];
    const ultimo = leituras.length ? leituras[leituras.length - 1].val : null;
    return { nome: `BV${n}`, status: ultimo };
  });

  const corStatus = (s) => s === "Operando" ? p.sucesso : s === "Manutenção" ? p.alerta : p.textoTerciario;
  const labelRotina = (r) => r === "mecanica" ? "Mecânica" : r === "eletrica" ? "Elétrica" : "Start up";
  const corRotina   = (r) => r === "mecanica" ? TEMAS.mecanica.accent : r === "eletrica" ? TEMAS.eletrica.accent : TEMAS.startup.accent;

  // ── Anomalias agregadas ──────────────────────────────────────────────────
  const anomaliasPorArea = {};
  (anomalias || []).forEach((a) => {
    const chave = a.area_nome;
    anomaliasPorArea[chave] = (anomaliasPorArea[chave] || 0) + 1;
  });
  const rankingAreas = Object.entries(anomaliasPorArea)
    .map(([area, count]) => ({ area, count }))
    .sort((a, b) => b.count - a.count)
    .slice(0, 8);

  const anomaliasRecentes = (anomalias || []).slice(0, 10);

  // ── Ranking de usuários (por itens concluídos no período selecionado) ────
  const porUsuarioPeriodo = {};
  registros.forEach((r) => {
    const chave = r.usuario_nome;
    if (!porUsuarioPeriodo[chave]) {
      porUsuarioPeriodo[chave] = { checked: 0, total: 0, dias: new Set(), usuario_id: r.usuario_id };
    }
    porUsuarioPeriodo[chave].checked += r.checked_items ? r.checked_items.filter(Boolean).length : 0;
    porUsuarioPeriodo[chave].total   += r.checked_items ? r.checked_items.length : 0;
    porUsuarioPeriodo[chave].dias.add(r.data);
  });

  const ranking = Object.entries(porUsuarioPeriodo)
    .map(([nome, d]) => ({
      nome,
      checked: d.checked,
      total: d.total,
      dias: d.dias.size,
      pct: d.total ? Math.round((d.checked / d.total) * 100) : 0,
      usuario_id: d.usuario_id,
    }))
    .sort((a, b) => b.checked - a.checked || b.dias - a.dias);

  const usuarioFoto = (id) => {
    const u = usuarios.find((x) => x.id === id);
    return u ? u.foto_url : null;
  };

  const medalha = (pos) => pos === 0 ? "🥇" : pos === 1 ? "🥈" : pos === 2 ? "🥉" : null;

  const cardStyle = { background: p.superficie, border: `1px solid ${p.borda}`, borderRadius: "24px", padding: "20px", boxShadow: p === PALETA.claro ? "0 2px 8px rgba(23,23,23,0.06)" : "none" };

  return (
    <div className="flex flex-col gap-4 pb-8">

      {/* Seletor de período */}
      <div className="flex rounded-2xl p-1" style={{ background: p.superficie, border: `1px solid ${p.borda}` }}>
        {[7, 30].map((periodoOpcao) => (
          <button
            key={periodoOpcao}
            onClick={() => setPeriodo(periodoOpcao)}
            className="flex-1 rounded-xl py-2 text-[13px] font-medium transition-all"
            style={{
              background: periodo === periodoOpcao ? tema.gradient : "transparent",
              color: periodo === periodoOpcao ? "#FFFFFF" : p.textoTerciario,
            }}
          >
            {periodoOpcao === 7 ? "Últimos 7 dias" : "Últimos 30 dias"}
          </button>
        ))}
      </div>

      {/* KPIs gerais */}
      <div className="grid grid-cols-3 gap-2">
        {[
          { label: "Taxa geral", valor: `${taxaGeral}%`, cor: tema.accent },
          { label: "Dias com dados", valor: diasComDados, cor: p.sucesso },
          { label: "Usuários", valor: usuarios.length, cor: TEMAS.eletrica.accent },
        ].map(({ label, valor, cor }) => (
          <div key={label} style={{ ...cardStyle, padding: "14px", textAlign: "center" }}>
            <p className="text-[22px] font-bold" style={{ color: cor }}>{valor}</p>
            <p className="text-[10px] leading-tight mt-1" style={{ color: p.textoTerciario }}>{label}</p>
          </div>
        ))}
      </div>

      {/* Progresso hoje por usuário */}
      <div style={cardStyle}>
        <h3 className="mb-4 text-[13px] font-semibold uppercase tracking-wider" style={{ color: p.textoTerciario }}>
          Hoje — {Object.keys(porUsuarioHoje).length > 0 ? `${Object.keys(porUsuarioHoje).length} usuário(s) ativos` : "nenhum registro ainda"}
        </h3>
        {Object.keys(porUsuarioHoje).length === 0 ? (
          <p className="text-[13px]" style={{ color: p.textoTerciario }}>Nenhum dado registrado hoje ainda.</p>
        ) : (
          <div className="flex flex-col gap-3">
            {Object.entries(porUsuarioHoje).map(([nome, d]) => {
              const pct = d.total ? Math.round((d.checked / d.total) * 100) : 0;
              return (
                <div key={nome}>
                  <div className="mb-1.5 flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <div
                        className="flex h-7 w-7 items-center justify-center rounded-xl text-[12px] font-bold"
                        style={{ background: tema.accentSoft, color: tema.accent }}
                      >
                        {nome[0]}
                      </div>
                      <span className="text-[13px] font-medium" style={{ color: p.texto }}>{nome}</span>
                    </div>
                    <div className="flex items-center gap-2">
                      {[...d.rotinas].map((r) => (
                        <span key={r} className="rounded-full px-2 py-0.5 text-[10px] font-medium" style={{ background: `${corRotina(r)}20`, color: corRotina(r) }}>
                          {labelRotina(r)}
                        </span>
                      ))}
                      <span className="text-[12px] font-semibold" style={{ color: pct === 100 ? p.sucesso : p.textoSecundario }}>{pct}%</span>
                    </div>
                  </div>
                  <div className="h-1.5 w-full overflow-hidden rounded-full" style={{ background: p.superficieAlt }}>
                    <div className="h-full rounded-full transition-all" style={{ width: `${pct}%`, background: pct === 100 ? p.sucesso : tema.accent }} />
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Gráfico de barras — progresso diário */}
      <div style={cardStyle}>
        <h3 className="mb-4 text-[13px] font-semibold uppercase tracking-wider" style={{ color: p.textoTerciario }}>
          Progresso diário
        </h3>
        {diasOrdenados.length === 0 ? (
          <p className="text-[13px]" style={{ color: p.textoTerciario }}>Sem dados no período.</p>
        ) : (
          <div className="flex items-end gap-1.5" style={{ height: "80px" }}>
            {diasOrdenados.map((dia) => {
              const { checked, total } = porDia[dia];
              const pct = total ? checked / total : 0;
              const alturaMin = 4;
              const altura = alturaMin + pct * (80 - alturaMin);
              const dd = dia.slice(8);
              return (
                <div key={dia} className="flex flex-1 flex-col items-center gap-1">
                  <div
                    className="w-full rounded-t-md transition-all"
                    style={{ height: `${altura}px`, background: pct > 0.8 ? p.sucesso : pct > 0.5 ? tema.accent : p.superficieAlt }}
                  />
                  <span className="text-[9px]" style={{ color: p.textoTerciario }}>{dd}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Queimadores — temperatura média */}
      <div style={cardStyle}>
        <h3 className="mb-4 text-[13px] font-semibold uppercase tracking-wider" style={{ color: p.textoTerciario }}>
          Queimadores — temp. média (°C)
        </h3>
        <div className="flex gap-3">
          {queimadoresTemp.map(({ nome, media }) => (
            <div
              key={nome}
              className="flex flex-1 flex-col items-center gap-1 rounded-2xl py-4"
              style={{ background: p.superficieAlt }}
            >
              <span className="text-[20px] font-bold" style={{ color: media ? p.alerta : p.textoTerciario }}>
                {media !== null ? `${media}°` : "—"}
              </span>
              <span className="text-[11px]" style={{ color: p.textoTerciario }}>{nome}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Bombas de vácuo — status atual */}
      <div style={cardStyle}>
        <h3 className="mb-4 text-[13px] font-semibold uppercase tracking-wider" style={{ color: p.textoTerciario }}>
          Bombas de vácuo — status
        </h3>
        <div className="flex gap-2 flex-wrap">
          {bombasStatus.map(({ nome, status }) => (
            <div
              key={nome}
              className="flex flex-col items-center gap-1.5 rounded-2xl px-4 py-3"
              style={{ background: p.superficieAlt, minWidth: "56px" }}
            >
              <div className="h-2.5 w-2.5 rounded-full" style={{ background: corStatus(status) }} />
              <span className="text-[11px] font-semibold" style={{ color: p.texto }}>{nome}</span>
              <span className="text-[9px] text-center leading-tight" style={{ color: p.textoTerciario }}>
                {status || "—"}
              </span>
            </div>
          ))}
        </div>
      </div>

      {/* Anomalias — visão agregada de todos os usuários */}
      <div style={cardStyle}>
        <h3 className="mb-1 text-[13px] font-semibold uppercase tracking-wider" style={{ color: p.textoTerciario }}>
          ⚠ Anomalias — {periodo === 7 ? "últimos 7 dias" : "últimos 30 dias"}
        </h3>
        <p className="mb-4 text-[11.5px]" style={{ color: p.textoTerciario }}>
          {(anomalias || []).length} ocorrência(s) confirmadas pela equipe
        </p>

        {rankingAreas.length > 0 && (
          <div className="mb-4">
            <p className="mb-2 text-[11px] font-medium uppercase tracking-wide" style={{ color: p.textoTerciario }}>
              Por área
            </p>
            <div className="flex flex-col gap-1.5">
              {rankingAreas.map(({ area, count }) => (
                <div key={area} className="flex items-center gap-2">
                  <span className="w-32 shrink-0 truncate text-[12px]" style={{ color: p.textoSecundario }}>{area}</span>
                  <div className="h-1.5 flex-1 overflow-hidden rounded-full" style={{ background: p.superficieAlt }}>
                    <div
                      className="h-full rounded-full"
                      style={{ width: `${(count / rankingAreas[0].count) * 100}%`, background: p.alerta }}
                    />
                  </div>
                  <span className="w-5 shrink-0 text-right text-[12px] font-semibold" style={{ color: p.alerta }}>{count}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {anomaliasRecentes.length > 0 ? (
          <div>
            <p className="mb-2 text-[11px] font-medium uppercase tracking-wide" style={{ color: p.textoTerciario }}>
              Mais recentes
            </p>
            <div className="flex flex-col gap-2">
              {anomaliasRecentes.map((a) => (
                <div key={a.id} className="rounded-xl p-2.5" style={{ background: p.alertaSoft, border: `1px solid ${p.alerta}30` }}>
                  <div className="mb-1 flex items-center justify-between">
                    <span className="text-[11.5px] font-medium" style={{ color: p.alerta }}>{a.area_nome}</span>
                    <span className="text-[10px]" style={{ color: p.textoTerciario }}>
                      {a.usuario_nome} · {formatarDataCurta(new Date(a.data + "T00:00:00"))}
                    </span>
                  </div>
                  {a.observacao && (
                    <p className="text-[12px] leading-snug" style={{ color: p.textoSecundario }}>{a.observacao}</p>
                  )}
                </div>
              ))}
            </div>
          </div>
        ) : (
          <p className="text-[13px]" style={{ color: p.textoTerciario }}>Nenhuma anomalia registrada no período.</p>
        )}
      </div>

      {/* Ranking de usuários */}
      <div style={cardStyle}>
        <h3 className="mb-4 text-[13px] font-semibold uppercase tracking-wider" style={{ color: p.textoTerciario }}>
          🏆 Ranking — {periodo === 7 ? "últimos 7 dias" : "últimos 30 dias"}
        </h3>
        {ranking.length === 0 ? (
          <p className="text-[13px]" style={{ color: p.textoTerciario }}>Sem dados no período.</p>
        ) : (
          <div className="flex flex-col gap-2">
            {ranking.map((r, idx) => {
              const foto = usuarioFoto(r.usuario_id);
              const med = medalha(idx);
              return (
                <div
                  key={r.nome}
                  className="flex items-center gap-3 rounded-2xl px-3 py-2.5"
                  style={{ background: idx === 0 ? tema.accentSoft : p.superficieAlt, border: idx === 0 ? `1px solid ${tema.accentBorder}` : "1px solid transparent" }}
                >
                  <div className="flex h-6 w-6 shrink-0 items-center justify-center text-[13px] font-bold" style={{ color: p.textoTerciario }}>
                    {med || `${idx + 1}º`}
                  </div>
                  <div
                    className="flex h-9 w-9 shrink-0 items-center justify-center overflow-hidden rounded-xl text-[13px] font-bold"
                    style={{ background: tema.accentSoft, color: tema.accent }}
                  >
                    {foto ? <img src={foto} alt="" className="h-full w-full object-cover" /> : r.nome[0].toUpperCase()}
                  </div>
                  <div className="min-w-0 flex-1">
                    <p className="truncate text-[13px] font-medium" style={{ color: p.texto }}>{r.nome}</p>
                    <p className="text-[11px]" style={{ color: p.textoTerciario }}>{r.dias} dia(s) ativos</p>
                  </div>
                  <div className="text-right">
                    <p className="text-[15px] font-bold" style={{ color: tema.accent }}>{r.checked}</p>
                    <p className="text-[10px]" style={{ color: p.textoTerciario }}>itens ({r.pct}%)</p>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Lista de usuários cadastrados */}
      <div style={cardStyle}>
        <h3 className="mb-4 text-[13px] font-semibold uppercase tracking-wider" style={{ color: p.textoTerciario }}>
          Usuários cadastrados ({usuarios.length})
        </h3>
        <div className="flex flex-col gap-2">
          {usuarios.map((u) => {
            const meusReg = registros.filter((r) => r.usuario_id === u.id);
            const diasComRegistro = new Set(meusReg.map((r) => r.data));
            const diasU = diasComRegistro.size;
            const hoje = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
            const ativoHoje = diasComRegistro.has(hoje);

            // Última atividade real (atualizado_em mais recente entre os registros do usuário)
            const ultimaAtividade = meusReg.reduce((max, r) => {
              const t = r.atualizado_em ? new Date(r.atualizado_em).getTime() : 0;
              return t > max ? t : max;
            }, 0);
            const textoUltimaAtividade = ultimaAtividade
              ? new Date(ultimaAtividade).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })
              : "sem registros";

            return (
              <div key={u.id} className="flex items-center gap-3 rounded-2xl px-3 py-2.5" style={{ background: p.superficieAlt }}>
                <div className="relative shrink-0">
                  <div
                    className="flex h-9 w-9 items-center justify-center overflow-hidden rounded-xl text-[13px] font-bold"
                    style={{ background: tema.accentSoft, color: tema.accent }}
                  >
                    {u.foto_url
                      ? <img src={u.foto_url} alt="" className="h-full w-full object-cover" />
                      : u.nome[0].toUpperCase()
                    }
                  </div>
                  {ativoHoje && (
                    <span
                      className="absolute -right-0.5 -bottom-0.5 h-2.5 w-2.5 rounded-full border-2"
                      style={{ background: p.sucesso, borderColor: p.superficie }}
                      title="Ativo hoje"
                    />
                  )}
                </div>
                <div className="min-w-0 flex-1">
                  <p className="text-[13px] font-medium truncate" style={{ color: p.texto }}>
                    {u.nome} {u.sobrenome}
                    {u.role === "admin" && (
                      <span className="ml-1.5 rounded-full px-1.5 py-0.5 text-[9px] font-semibold" style={{ background: tema.accentSoft, color: tema.accent }}>
                        ADMIN
                      </span>
                    )}
                  </p>
                  <p className="text-[11px]" style={{ color: p.textoTerciario }}>
                    {diasU} dia(s) ativos · última vez: {textoUltimaAtividade}
                  </p>
                </div>
                {ehAdmin && (
                  <button
                    onClick={() => onEditarUsuario(u)}
                    className="flex h-8 w-8 shrink-0 items-center justify-center rounded-xl"
                    style={{ background: p.superficie, color: p.textoSecundario }}
                  >
                    <Settings2 size={14} />
                  </button>
                )}
              </div>
            );
          })}
          {usuarios.length === 0 && (
            <p className="text-[13px]" style={{ color: p.textoTerciario }}>Nenhum usuário cadastrado ainda.</p>
          )}
        </div>
      </div>
    </div>
  );
}

function LoginModal({ onLogin, p, tema, precisaRecadastrar }) {
  const [step, setStep] = useState(precisaRecadastrar ? "cadastro" : "login"); // "login" | "cadastro" | "recuperar"
  // Cadastro
  const [nome, setNome] = useState("");
  const [sobrenome, setSobrenome] = useState("");
  const [loginCadastro, setLoginCadastro] = useState("");
  const [emailCadastro, setEmailCadastro] = useState("");
  // Login
  const [loginEntrada, setLoginEntrada] = useState(() => {
    const salvo = JSON.parse(localStorage.getItem("usuario_rotina") || "null");
    return salvo ? salvo.login || "" : "";
  });
  // Recuperação de senha
  const [emailRecuperacao, setEmailRecuperacao] = useState("");
  const [recuperacaoEnviada, setRecuperacaoEnviada] = useState(false);

  const [senha, setSenha] = useState("");
  const [confirmarSenha, setConfirmarSenha] = useState("");
  const [salvarSenha, setSalvarSenha] = useState(true);
  const [erro, setErro] = useState("");
  const [animando, setAnimando] = useState(false);
  const [carregando, setCarregando] = useState(false);
  const senhaRef = useRef(null);
  const confirmarRef = useRef(null);

  const senhaInputs = [0, 1, 2, 3];

  function confirmar(u) {
    setAnimando(true);
    setTimeout(() => onLogin(u), 350);
  }

  function handleSenhaDigito(idx, val) {
    if (!/^\d?$/.test(val)) return;
    const arr = senha.split("");
    arr[idx] = val;
    const nova = arr.join("").slice(0, 4);
    setSenha(nova);
    if (val && idx < 3) {
      const inputs = senhaRef.current.querySelectorAll("input");
      if (inputs[idx + 1]) inputs[idx + 1].focus();
    }
  }

  function handleConfirmarDigito(idx, val) {
    if (!/^\d?$/.test(val)) return;
    const arr = confirmarSenha.split("");
    arr[idx] = val;
    const nova = arr.join("").slice(0, 4);
    setConfirmarSenha(nova);
    if (val && idx < 3) {
      const inputs = confirmarRef.current.querySelectorAll("input");
      if (inputs[idx + 1]) inputs[idx + 1].focus();
    }
  }

  function handleKeyDownSenha(idx, e) {
    if (e.key === "Backspace" && !senha[idx] && idx > 0) {
      const prev = senhaRef.current.querySelectorAll("input")[idx - 1];
      if (prev) { prev.focus(); const arr = senha.split(""); arr[idx - 1] = ""; setSenha(arr.join("")); }
    }
  }

  function handleKeyDownConfirmar(idx, e) {
    if (e.key === "Backspace" && !confirmarSenha[idx] && idx > 0) {
      const prev = confirmarRef.current.querySelectorAll("input")[idx - 1];
      if (prev) { prev.focus(); const arr = confirmarSenha.split(""); arr[idx - 1] = ""; setConfirmarSenha(arr.join("")); }
    }
  }

  async function entrar() {
    setErro("");
    if (!loginEntrada.trim()) { setErro("Digite seu login."); return; }
    setCarregando(true);
    try {
      let usuarioDb = null;
      let erroBuscaSupabase = null;
      try {
        usuarioDb = await supaGetUsuarioPorLogin(loginEntrada);
      } catch (eBusca) {
        erroBuscaSupabase = eBusca;
        console.error("Falha ao buscar usuário no Supabase:", eBusca);
      }

      if (usuarioDb) {
        if (senha !== usuarioDb.senha) { setErro("Senha incorreta."); setSenha(""); setCarregando(false); return; }
        const dadosUsuario = {
          id: usuarioDb.id, nome: usuarioDb.nome, sobrenome: usuarioDb.sobrenome,
          login: usuarioDb.login, email: usuarioDb.email || null,
          foto_url: usuarioDb.foto_url || null, role: usuarioDb.role || "user",
        };
        localStorage.setItem("usuario_rotina", JSON.stringify({ ...dadosUsuario, senha }));
        if (salvarSenha) localStorage.setItem("usuario_sessao", JSON.stringify(dadosUsuario));
        confirmar(dadosUsuario);
      } else if (erroBuscaSupabase) {
        setErro(`Não foi possível conectar ao servidor (${erroBuscaSupabase.message || "erro desconhecido"}). Verifique sua internet e tente novamente.`);
        setCarregando(false);
        return;
      } else {
        setErro("Login não encontrado. Verifique ou faça o cadastro.");
        setCarregando(false);
        return;
      }
    } catch (e) {
      setErro("Erro de conexão. Verifique sua internet.");
    }
    setCarregando(false);
  }

  async function cadastrar() {
    setErro("");
    if (!nome.trim() || !sobrenome.trim()) { setErro("Preencha nome e sobrenome."); return; }
    if (!loginCadastro.trim()) { setErro("Escolha um login."); return; }
    if (!/^[a-zA-Z0-9._-]{3,}$/.test(loginCadastro.trim())) { setErro("O login deve ter ao menos 3 caracteres (letras, números, ponto, hífen)."); return; }
    if (!emailCadastro.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailCadastro.trim())) { setErro("Digite um e-mail válido — ele será usado para recuperar sua senha."); return; }
    if (senha.length !== 4) { setErro("A senha deve ter 4 dígitos."); return; }
    if (senha !== confirmarSenha) { setErro("As senhas não coincidem."); return; }
    setCarregando(true);
    try {
      let loginExiste = null;
      try { loginExiste = await supaGetUsuarioPorLogin(loginCadastro.trim()); } catch (eBusca) {
        console.error("Falha ao verificar login existente:", eBusca);
      }
      if (loginExiste) { setErro("Esse login já está em uso. Escolha outro."); setCarregando(false); return; }

      let novoUsuario = null;
      let erroCadastroSupabase = null;
      try {
        novoUsuario = await supaCreateUsuario(nome.trim(), sobrenome.trim(), loginCadastro.trim(), senha, emailCadastro.trim());
      } catch (eCriacao) {
        erroCadastroSupabase = eCriacao;
        console.error("Falha ao criar usuário no Supabase:", eCriacao);
      }

      if (!novoUsuario) {
        const detalhe = erroCadastroSupabase && erroCadastroSupabase.message ? erroCadastroSupabase.message : "erro desconhecido";
        setErro(`Não foi possível salvar seu cadastro no servidor (${detalhe}). Verifique sua internet e tente novamente.`);
        setCarregando(false);
        return;
      }

      // Cria a conta espelho no Supabase Auth para viabilizar a recuperação de senha por e-mail
      // (senha interna aleatória — o PIN do nosso sistema é sempre o que o usuário realmente usa)
      const senhaInternaAuth = `Rm${novoUsuario.id.replace(/-/g, "").slice(0, 20)}!`;
      supaGarantirContaAuth(emailCadastro.trim(), senhaInternaAuth).catch(() => {});

      const dadosUsuario = {
        id: novoUsuario.id, nome: novoUsuario.nome, sobrenome: novoUsuario.sobrenome,
        login: novoUsuario.login, email: novoUsuario.email || null,
        foto_url: novoUsuario.foto_url || null, role: novoUsuario.role || "user",
      };
      localStorage.setItem("usuario_rotina", JSON.stringify({ ...dadosUsuario, senha }));
      if (salvarSenha) localStorage.setItem("usuario_sessao", JSON.stringify(dadosUsuario));
      confirmar(dadosUsuario);
    } catch (e) {
      setErro("Erro ao cadastrar. Verifique sua conexão.");
    }
    setCarregando(false);
  }

  async function enviarRecuperacao() {
    setErro("");
    if (!emailRecuperacao.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailRecuperacao.trim())) {
      setErro("Digite um e-mail válido.");
      return;
    }
    setCarregando(true);
    try {
      const usuarioDb = await supaGetUsuarioPorEmail(emailRecuperacao.trim());
      if (!usuarioDb) {
        setErro("Não encontramos nenhum cadastro com esse e-mail.");
        setCarregando(false);
        return;
      }
      await supaEnviarEmailRecuperacao(emailRecuperacao.trim());
      setRecuperacaoEnviada(true);
    } catch (e) {
      setErro(`Não foi possível enviar o e-mail (${e && e.message ? e.message : "erro desconhecido"}). Tente novamente.`);
    }
    setCarregando(false);
  }

  const inputStyle = {
    background: p.superficieAlt,
    border: `1px solid ${p.bordaForte}`,
    color: p.texto,
    outline: "none",
  };

  return (
    <div
      className="fixed inset-0 z-[100] flex items-center justify-center p-5"
      style={{ background: p.overlay, backdropFilter: "blur(12px)" }}
    >
      <div
        className="w-full max-w-sm rounded-3xl p-6 transition-all duration-350"
        style={{
          background: p.superficie,
          border: `1px solid ${p.borda}`,
          boxShadow: p === PALETA.claro ? "0 24px 64px rgba(23,23,23,0.22)" : "0 32px 80px rgba(0,0,0,0.6)",
          transform: animando ? "scale(0.92)" : "scale(1)",
          opacity: animando ? 0 : 1,
        }}
      >
        {/* Logo / ícone */}
        <div className="mb-5 flex flex-col items-center gap-2">
          <div
            className="flex h-14 w-14 items-center justify-center rounded-2xl"
            style={{ background: tema.accentSoft, border: `1px solid ${tema.accentBorder}` }}
          >
            <ClipboardList size={26} color={tema.accent} strokeWidth={2} />
          </div>
          <div className="text-center">
            <h2 className="text-[17px] font-bold" style={{ color: p.texto }}>Rotina de Manutenção</h2>
            <p className="text-[12px]" style={{ color: p.textoTerciario }}>
              {step === "login" ? "Bem-vindo de volta" : step === "recuperar" ? "Recuperar senha" : "Crie seu acesso"}
            </p>
          </div>
        </div>

        {/* Aviso cordial de recadastro */}
        {precisaRecadastrar && step === "cadastro" && (
          <div className="mb-4 rounded-xl p-3.5" style={{ background: tema.accentSoft, border: `1px solid ${tema.accentBorder}` }}>
            <p className="text-[13px] leading-relaxed" style={{ color: p.texto }}>
              Olá, companheiro(a)! 👋 O nosso app mudou, está de cara nova e com novas funções — por isso
              gostaríamos que atualizasse seus dados cadastrais. É rapidinho!
            </p>
          </div>
        )}

        {/* ── TELA: RECUPERAR SENHA ── */}
        {step === "recuperar" ? (
          <>
            {!recuperacaoEnviada ? (
              <>
                <div className="mb-4">
                  <label className="mb-2 block text-[11px] font-medium uppercase tracking-wide" style={{ color: p.textoTerciario }}>
                    E-mail cadastrado
                  </label>
                  <input
                    type="email"
                    value={emailRecuperacao}
                    onChange={(e) => setEmailRecuperacao(e.target.value)}
                    placeholder="seuemail@exemplo.com"
                    className="w-full rounded-xl px-3 py-2.5 text-[14px]"
                    style={inputStyle}
                  />
                </div>

                {erro && (
                  <div className="mb-3 flex items-center gap-2 rounded-xl px-3 py-2" style={{ background: p.alertaSoft, border: `1px solid ${p.alerta}40` }}>
                    <AlertTriangle size={13} color={p.alerta} />
                    <p className="text-[12px]" style={{ color: p.alerta }}>{erro}</p>
                  </div>
                )}

                <button
                  onClick={enviarRecuperacao}
                  disabled={carregando}
                  className="mb-3 w-full rounded-2xl py-3.5 text-[14.5px] font-semibold transition-all active:scale-[0.98]"
                  style={{ background: carregando ? tema.accentSoft : tema.gradient, color: "#FFFFFF", opacity: carregando ? 0.8 : 1 }}
                >
                  {carregando ? "Enviando..." : "Enviar e-mail de recuperação"}
                </button>
              </>
            ) : (
              <div className="mb-4 flex flex-col items-center gap-3 rounded-xl p-4 text-center" style={{ background: p.sucessoSoft }}>
                <CheckCircle2 size={28} color={p.sucesso} />
                <p className="text-[13px] leading-relaxed" style={{ color: p.texto }}>
                  Enviamos um e-mail para <strong>{emailRecuperacao}</strong> com as instruções para redefinir sua senha.
                </p>
              </div>
            )}

            <button
              onClick={() => { setStep("login"); setErro(""); setRecuperacaoEnviada(false); }}
              className="w-full py-2 text-[12.5px] text-center transition-colors"
              style={{ color: p.textoTerciario }}
            >
              ← Voltar para o login
            </button>
          </>
        ) : (
        <>
        {step === "cadastro" && (
          <>
            <div className="mb-3 flex gap-2">
              <div className="flex-1">
                <label className="mb-1 block text-[11px] font-medium uppercase tracking-wide" style={{ color: p.textoTerciario }}>Nome</label>
                <input
                  type="text"
                  value={nome}
                  onChange={(e) => setNome(e.target.value)}
                  placeholder="Leonardo"
                  className="w-full rounded-xl px-3 py-2.5 text-[14px]"
                  style={inputStyle}
                />
              </div>
              <div className="flex-1">
                <label className="mb-1 block text-[11px] font-medium uppercase tracking-wide" style={{ color: p.textoTerciario }}>Sobrenome</label>
                <input
                  type="text"
                  value={sobrenome}
                  onChange={(e) => setSobrenome(e.target.value)}
                  placeholder="Silva"
                  className="w-full rounded-xl px-3 py-2.5 text-[14px]"
                  style={inputStyle}
                />
              </div>
            </div>
            <div className="mb-3">
              <label className="mb-1 block text-[11px] font-medium uppercase tracking-wide" style={{ color: p.textoTerciario }}>
                Login (para entrar no app)
              </label>
              <input
                type="text"
                value={loginCadastro}
                onChange={(e) => setLoginCadastro(e.target.value.replace(/\s/g, ""))}
                placeholder="leo.franklin"
                autoCapitalize="none"
                className="w-full rounded-xl px-3 py-2.5 text-[14px]"
                style={inputStyle}
              />
            </div>
            <div className="mb-4">
              <label className="mb-1 block text-[11px] font-medium uppercase tracking-wide" style={{ color: p.textoTerciario }}>
                E-mail (para recuperar sua senha)
              </label>
              <input
                type="email"
                value={emailCadastro}
                onChange={(e) => setEmailCadastro(e.target.value)}
                placeholder="seuemail@exemplo.com"
                className="w-full rounded-xl px-3 py-2.5 text-[14px]"
                style={inputStyle}
              />
            </div>
          </>
        )}

        {step === "login" && (
          <div className="mb-4">
            <label className="mb-1 block text-[11px] font-medium uppercase tracking-wide" style={{ color: p.textoTerciario }}>Login</label>
            <input
              type="text"
              value={loginEntrada}
              onChange={(e) => setLoginEntrada(e.target.value.replace(/\s/g, ""))}
              placeholder="leo.franklin"
              autoCapitalize="none"
              className="w-full rounded-xl px-3 py-2.5 text-[14px]"
              style={inputStyle}
            />
          </div>
        )}

        {/* PIN de senha */}
        <div className="mb-4">
          <label className="mb-2 block text-[11px] font-medium uppercase tracking-wide" style={{ color: p.textoTerciario }}>
            {step === "cadastro" ? "Criar senha (4 dígitos)" : "Senha (4 dígitos)"}
          </label>
          <div ref={senhaRef} className="flex justify-center gap-3">
            {senhaInputs.map((idx) => (
              <input
                key={idx}
                type="password"
                inputMode="numeric"
                maxLength={1}
                value={senha[idx] || ""}
                onChange={(e) => handleSenhaDigito(idx, e.target.value)}
                onKeyDown={(e) => handleKeyDownSenha(idx, e)}
                className="h-12 w-12 rounded-xl text-center text-[20px] font-bold"
                style={{
                  ...inputStyle,
                  border: senha[idx] ? `1.5px solid ${tema.accent}` : `1px solid ${p.bordaForte}`,
                }}
              />
            ))}
          </div>
          {step === "login" && (
            <button
              onClick={() => { setStep("recuperar"); setErro(""); }}
              className="mt-2 w-full text-center text-[12px] transition-colors"
              style={{ color: tema.accent }}
            >
              Esqueci minha senha
            </button>
          )}
        </div>

        {step === "cadastro" && (
          <div className="mb-4">
            <label className="mb-2 block text-[11px] font-medium uppercase tracking-wide" style={{ color: p.textoTerciario }}>
              Confirmar senha
            </label>
            <div ref={confirmarRef} className="flex justify-center gap-3">
              {senhaInputs.map((idx) => (
                <input
                  key={idx}
                  type="password"
                  inputMode="numeric"
                  maxLength={1}
                  value={confirmarSenha[idx] || ""}
                  onChange={(e) => handleConfirmarDigito(idx, e.target.value)}
                  onKeyDown={(e) => handleKeyDownConfirmar(idx, e)}
                  className="h-12 w-12 rounded-xl text-center text-[20px] font-bold"
                  style={{
                    ...inputStyle,
                    border: confirmarSenha[idx] ? `1.5px solid ${tema.accent}` : `1px solid ${p.bordaForte}`,
                  }}
                />
              ))}
            </div>
          </div>
        )}

        {/* Salvar senha */}
        <button
          onClick={() => setSalvarSenha(!salvarSenha)}
          className="mb-4 flex w-full items-center gap-2.5"
        >
          <span
            className="flex h-5 w-5 shrink-0 items-center justify-center rounded-md transition-colors"
            style={{
              background: salvarSenha ? tema.accent : "transparent",
              border: salvarSenha ? "none" : `1.5px solid ${p.bordaForte}`,
            }}
          >
            {salvarSenha && <Check size={13} strokeWidth={3} color="#FFFFFF" />}
          </span>
          <span className="text-[12.5px]" style={{ color: p.textoSecundario }}>
            Salvar acesso neste dispositivo
          </span>
        </button>

        {erro && (
          <div className="mb-3 flex items-center gap-2 rounded-xl px-3 py-2" style={{ background: p.alertaSoft, border: `1px solid ${p.alerta}40` }}>
            <AlertTriangle size={13} color={p.alerta} />
            <p className="text-[12px]" style={{ color: p.alerta }}>{erro}</p>
          </div>
        )}

        <button
          onClick={step === "login" ? entrar : cadastrar}
          disabled={carregando}
          className="mb-3 w-full rounded-2xl py-3.5 text-[14.5px] font-semibold transition-all active:scale-[0.98]"
          style={{
            background: carregando ? tema.accentSoft : tema.gradient,
            color: "#FFFFFF",
            opacity: carregando ? 0.8 : 1,
          }}
        >
          {carregando ? "Aguarde..." : step === "login" ? "Entrar" : "Criar acesso e entrar"}
        </button>

        <button
          onClick={() => { setStep(step === "login" ? "cadastro" : "login"); setErro(""); setSenha(""); setConfirmarSenha(""); }}
          className="w-full py-2 text-[12.5px] text-center transition-colors"
          style={{ color: p.textoTerciario }}
        >
          {step === "login" ? "Primeiro acesso? Cadastrar" : "Já tenho acesso → Entrar"}
        </button>
        </>
        )}
      </div>
    </div>
  );
}

function AreaCard({ area, status, onOpen, tema, p, fotoCount = 0 }) {
  const Icon = area.icon;
  const total = area.itens.length;
  const safeStatus = status || { checkedItems: [], valores: {}, comentario: "", savedAt: null };
  const checked = area.itens.filter((item, idx) => itemEstaCompleto(item, idx, safeStatus)).length;
  const isDone = safeStatus.savedAt != null;
  const hasComment = safeStatus.comentario && safeStatus.comentario.trim().length > 0;
  const progress = total > 0 ? checked / total : 0;
  const ehClaro = p === PALETA.claro;
  const corDestaque = isDone ? p.sucesso : tema.accent;

  return (
    <button
      onClick={() => onOpen(area.id)}
      className="group relative flex flex-col overflow-hidden rounded-xl text-left transition-all duration-150 active:scale-[0.98]"
      style={{
        background: p.superficie,
        border: `1px solid ${isDone ? p.sucesso + "50" : p.borda}`,
        boxShadow: ehClaro
          ? "0 1px 2px rgba(23,23,23,0.04), 0 4px 8px rgba(23,23,23,0.07), 0 8px 20px rgba(23,23,23,0.06)"
          : "0 4px 14px rgba(0,0,0,0.28)",
      }}
    >
      <div className="flex items-start justify-between gap-2 px-3 pt-3">
        <div
          className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg"
          style={{ background: isDone ? p.sucessoSoft : tema.accentSoft, color: corDestaque }}
        >
          <Icon size={16} strokeWidth={2} />
        </div>
        {isDone && (
          <span className="flex h-4.5 w-4.5 shrink-0 items-center justify-center rounded-full" style={{ background: p.sucesso }}>
            <Check size={10} strokeWidth={3.5} color="#FFFFFF" />
          </span>
        )}
      </div>

      <h3
        className="px-3 pb-1 pt-2 text-[13.5px] font-semibold leading-snug"
        style={{
          color: p.texto,
          display: "-webkit-box",
          WebkitLineClamp: 2,
          WebkitBoxOrient: "vertical",
          overflow: "hidden",
          minHeight: "34px",
        }}
      >
        {area.nome}
      </h3>

      <div className="flex items-center justify-between gap-2 px-3 pb-2.5 pt-1">
        <span className="text-[11.5px] font-medium tabular-nums" style={{ color: p.textoSecundario }}>
          {checked}/{total}
        </span>
        <div className="flex items-center gap-1">
          {fotoCount > 0 && (
            <span className="flex items-center gap-0.5" style={{ color: p.textoTerciario }} title="Possui fotos">
              <ImageIcon size={11} strokeWidth={2} />
              <span className="text-[10px] font-medium">{fotoCount}</span>
            </span>
          )}
          {hasComment && (
            <MessageSquarePlus size={12} strokeWidth={2} style={{ color: p.textoTerciario }} />
          )}
        </div>
      </div>

      {/* Barra de progresso linear fina, na base do card */}
      <div className="h-[3px] w-full" style={{ background: ehClaro ? "rgba(23,23,23,0.06)" : "rgba(255,255,255,0.06)" }}>
        <div className="h-full transition-all duration-300" style={{ width: `${progress * 100}%`, background: corDestaque }} />
      </div>
    </button>
  );
}

}

// ----------------------------------------------------------------------------
// COMPONENTE: sub-card colapsável para grupo de equipamentos (Bombas, Compressores...)
// ----------------------------------------------------------------------------

function SubCardGrupo({ grupo, itensDoGrupo, status, valores, area, onChangeValor, tema, p }) {
  const [aberto, setAberto] = useState(false);

  const totalGrupo = itensDoGrupo.length;
  const completosGrupo = itensDoGrupo.filter(({ item, idx }) => itemEstaCompleto(item, idx, status)).length;
  const tudoCompleto = completosGrupo === totalGrupo;

  // Resumo de status (Operando/Parada/Manutenção) quando os itens do grupo usam esse padrão
  const resumoStatus = {};
  itensDoGrupo.forEach(({ item }) => {
    const campoStatus = item.campos.find((c) => c.tipo === "select");
    if (campoStatus) {
      const v = valores[campoStatus.id];
      if (v) resumoStatus[v] = (resumoStatus[v] || 0) + 1;
    }
  });

  const corStatus = (s) => s === "Operando" ? p.sucesso : s === "Manutenção" ? p.alerta : p.textoTerciario;

  return (
    <div
      className="mb-3 overflow-hidden rounded-xl"
      style={{
        background: tudoCompleto ? p.sucessoSoft : p.superficieAlt,
        border: `1px solid ${tudoCompleto ? p.sucesso + "35" : p.borda}`,
      }}
    >
      <button onClick={() => setAberto(!aberto)} className="flex w-full items-center justify-between gap-3 p-3.5 text-left">
        <div className="flex items-center gap-2.5">
          <span
            className="flex h-5 w-5 shrink-0 items-center justify-center rounded-md"
            style={{ background: tudoCompleto ? p.sucesso : "transparent", border: tudoCompleto ? "none" : `1.5px solid ${p.bordaForte}` }}
          >
            {tudoCompleto && <Check size={13} strokeWidth={3} color={p.textoInverso} />}
          </span>
          <div>
            <p className="text-[13.5px] font-medium" style={{ color: p.texto }}>{grupo}</p>
            <div className="mt-0.5 flex items-center gap-2">
              <span className="text-[11.5px]" style={{ color: p.textoTerciario }}>
                {completosGrupo}/{totalGrupo} preenchidos
              </span>
              {Object.entries(resumoStatus).map(([s, n]) => (
                <span key={s} className="flex items-center gap-1 text-[10.5px]" style={{ color: corStatus(s) }}>
                  <span className="h-1.5 w-1.5 rounded-full" style={{ background: corStatus(s) }} />
                  {n} {s.toLowerCase()}
                </span>
              ))}
            </div>
          </div>
        </div>
        <ChevronLeft size={16} color={p.textoTerciario} style={{ transform: aberto ? "rotate(90deg)" : "rotate(-90deg)", transition: "transform 0.2s" }} />
      </button>

      {aberto && (
        <div className="flex flex-col gap-2 px-3.5 pb-3.5">
          {itensDoGrupo.map(({ item, idx }) => {
            const completo = itemEstaCompleto(item, idx, status);
            return (
              <div
                key={idx}
                className="flex flex-col gap-2 rounded-lg p-2.5"
                style={{ background: p.superficie, border: `1px solid ${p.borda}` }}
              >
                <div className="flex items-center gap-2">
                  <span
                    className="flex h-4 w-4 shrink-0 items-center justify-center rounded"
                    style={{ background: completo ? p.sucesso : "transparent", border: completo ? "none" : `1.5px solid ${p.bordaForte}` }}
                  >
                    {completo && <Check size={10} strokeWidth={3} color={p.textoInverso} />}
                  </span>
                  <span className="text-[12.5px] font-medium" style={{ color: p.texto }}>{item.label}</span>
                </div>
                <div className="flex flex-wrap gap-2 pl-6">
                  {item.campos.map((campo) => (
                    <CampoInput key={campo.id} campo={campo} valor={valores[campo.id]} onChange={(v) => onChangeValor(area.id, campo.id, v)} p={p} />
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
