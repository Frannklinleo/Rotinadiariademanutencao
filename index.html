function ModalAtividadeNaoRotineira({ onClose, onConfirmar, tema, p, usuario, atividades }) {
  const [telaAtual, setTelaAtual] = useState("lista"); // "lista" | "formulario"
  const [idEmEdicao, setIdEmEdicao] = useState(null);
  const [descricao, setDescricao] = useState("");
  const [fotos, setFotos] = useState([]);
  const [enviandoFoto, setEnviandoFoto] = useState(false);
  const [perguntaWhatsappAberta, setPerguntaWhatsappAberta] = useState(false);
  const [isPreventiva, setIsPreventiva] = useState(false);
  const [numeroOS, setNumeroOS] = useState("");
  const [descricaoPreventiva, setDescricaoPreventiva] = useState("");
  const fileInputRef = useRef(null);
  const cameraInputRef = useRef(null);

  // Se não há nenhuma atividade ainda, vai direto para o formulário (não faz sentido mostrar lista vazia)
  useEffect(() => {
    if (!atividades || atividades.length === 0) {
      setTelaAtual("formulario");
    }
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  function abrirNovaAtividade() {
    setIdEmEdicao(null);
    setDescricao("");
    setFotos([]);
    setIsPreventiva(false);
    setNumeroOS("");
    setDescricaoPreventiva("");
    setTelaAtual("formulario");
  }

  function abrirEdicaoAtividade(atividade) {
    setIdEmEdicao(atividade.id);
    setDescricao(atividade.descricao || "");
    setFotos(atividade.fotos || []);
    setIsPreventiva(!!atividade.preventiva);
    setNumeroOS(atividade.preventiva ? atividade.preventiva.numeroOS : "");
    setDescricaoPreventiva(atividade.preventiva ? atividade.preventiva.descricao : "");
    setTelaAtual("formulario");
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handleFilesSelected(e) {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    setEnviandoFoto(true);
    const novas = await Promise.all(
      files.map(async (file) => ({
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        dataUrl: await fileToDataUrl(file),
      }))
    );
    setFotos((prev) => [...prev, ...novas]);
    setEnviandoFoto(false);
    e.target.value = "";
  }

  function removeFoto(id) {
    setFotos((prev) => prev.filter((f) => f.id !== id));
  }

  const podeConfirmar = isPreventiva
    ? numeroOS.trim().length > 0 && descricaoPreventiva.trim().length > 0
    : descricao.trim().length > 0;

  function handleConfirmarClick() {
    if (!podeConfirmar) return;
    // Edições não perguntam sobre WhatsApp — só criações novas fazem esse fluxo
    if (idEmEdicao) {
      finalizar(false);
    } else {
      setPerguntaWhatsappAberta(true);
    }
  }

  function finalizar(divulgarWhatsapp) {
    onConfirmar({
      descricao: descricao.trim(),
      fotos,
      preventiva: isPreventiva ? { numeroOS: numeroOS.trim(), descricao: descricaoPreventiva.trim() } : null,
    }, divulgarWhatsapp, idEmEdicao);
    if (idEmEdicao) {
      onClose();
    }
  }

  const inputStyle = {
    background: p.superficieAlt,
    border: `1px solid ${p.bordaForte}`,
    color: p.texto,
    outline: "none",
  };

  return (
    <div
      className="fixed inset-0 z-50 flex flex-col"
      style={{ background: p.overlay, backdropFilter: "blur(4px)" }}
    >
      <div
        className="relative flex flex-col overflow-hidden rounded-3xl"
        style={{
          background: p.superficie,
          border: `1px solid ${p.borda}`,
          boxShadow: p === PALETA.claro ? "0 -8px 40px rgba(23,23,23,0.18)" : "0 -8px 40px rgba(0,0,0,0.45)",
          margin: "auto 12px",
          width: "calc(100% - 24px)",
          maxWidth: "480px",
          maxHeight: "calc(100% - 48px)",
        }}
      >
        {/* Header */}
        <div
          className="flex shrink-0 items-center justify-between gap-3 px-5 pb-4 pt-5"
          style={{ borderBottom: `1px solid ${p.borda}` }}
        >
          <div className="flex items-center gap-3">
            {telaAtual === "formulario" && atividades && atividades.length > 0 && (
              <button
                onClick={() => setTelaAtual("lista")}
                className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full"
                style={{ background: p.superficieAlt, color: p.textoSecundario }}
              >
                <ChevronLeft size={17} />
              </button>
            )}
            <div
              className="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl"
              style={{ background: tema.accentSoft, color: tema.accent }}
            >
              <ClipboardList size={20} strokeWidth={2} />
            </div>
            <h2 className="text-[16px] font-semibold leading-tight" style={{ color: p.texto }}>
              {telaAtual === "lista" ? "Atividades não rotineiras" : idEmEdicao ? "Editar atividade" : "Nova atividade"}
            </h2>
          </div>
          <button
            onClick={onClose}
            className="flex shrink-0 items-center gap-1.5 rounded-full px-3 py-2 transition-colors"
            style={{ background: p.superficieAlt, color: p.textoSecundario }}
          >
            <X size={16} />
          </button>
        </div>

        {/* Tela de lista: atividades já registradas no dia */}
        {telaAtual === "lista" && (
          <div
            className="px-5 py-4"
            style={{ flex: "1 1 0%", minHeight: 0, overflowY: "auto", WebkitOverflowScrolling: "touch", overscrollBehavior: "contain" }}
          >
            <div className="flex flex-col gap-2.5">
              {(atividades || []).map((a) => (
                <div
                  key={a.id}
                  className="rounded-xl p-3.5"
                  style={{ background: p.superficieAlt, border: `1px solid ${p.borda}` }}
                >
                  <div className="mb-1.5 flex items-start justify-between gap-2">
                    {a.preventiva ? (
                      <span className="text-[13px] font-semibold" style={{ color: tema.accent }}>
                        Preventiva — O.S. {a.preventiva.numeroOS}
                      </span>
                    ) : (
                      <span className="text-[13px] font-semibold" style={{ color: p.texto }}>
                        Atividade não rotineira
                      </span>
                    )}
                    <button
                      onClick={() => abrirEdicaoAtividade(a)}
                      className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full transition-colors"
                      style={{ background: p.superficie, color: p.textoSecundario }}
                      title="Editar"
                    >
                      <Settings2 size={13} />
                    </button>
                  </div>
                  {a.descricao && (
                    <p className="text-[12.5px] leading-snug" style={{ color: p.textoSecundario }}>
                      {"> "}{a.descricao}
                    </p>
                  )}
                  {a.preventiva && a.preventiva.descricao && (
                    <p className="mt-1 text-[12.5px] leading-snug" style={{ color: p.textoSecundario }}>
                      {"> "}Serviço: {a.preventiva.descricao}
                    </p>
                  )}
                  {a.fotos && a.fotos.length > 0 && (
                    <p className="mt-1.5 text-[11px]" style={{ color: p.textoTerciario }}>
                      {a.fotos.length} foto{a.fotos.length > 1 ? "s" : ""} anexada{a.fotos.length > 1 ? "s" : ""}
                    </p>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Formulário: nova atividade ou edição */}
        {telaAtual === "formulario" && (
        <div
          className="px-5 py-4"
          style={{ flex: "1 1 0%", minHeight: 0, overflowY: "auto", WebkitOverflowScrolling: "touch", overscrollBehavior: "contain" }}
        >
          {/* Switch: Preventiva */}
          <div className="mb-4 rounded-xl p-3.5" style={{ background: p.superficieAlt, border: `1px solid ${p.borda}` }}>
            <button
              onClick={() => setIsPreventiva(!isPreventiva)}
              className="flex w-full items-center justify-between gap-3"
            >
              <span className="text-[13.5px] font-medium" style={{ color: p.texto }}>
                Preventiva
              </span>
              <span
                className="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full transition-colors duration-200"
                style={{ background: isPreventiva ? tema.accent : p.bordaForte }}
              >
                <span
                  className="inline-block h-4.5 w-4.5 transform rounded-full bg-white shadow transition-transform duration-200"
                  style={{ transform: isPreventiva ? "translateX(22px)" : "translateX(3px)", height: "18px", width: "18px" }}
                />
              </span>
            </button>

            {isPreventiva && (
              <div className="mt-3.5 flex flex-col gap-3">
                <div>
                  <label className="mb-1.5 block text-[11.5px] font-medium" style={{ color: p.textoSecundario }}>
                    Número da O.S.
                  </label>
                  <input
                    type="text"
                    value={numeroOS}
                    onChange={(e) => setNumeroOS(e.target.value)}
                    placeholder="Ex: OS-2026-0451"
                    className="w-full rounded-xl px-3 py-2.5 text-[13.5px] outline-none"
                    style={inputStyle}
                  />
                </div>
                <div>
                  <label className="mb-1.5 block text-[11.5px] font-medium" style={{ color: p.textoSecundario }}>
                    O que foi feito na preventiva
                  </label>
                  <textarea
                    value={descricaoPreventiva}
                    onChange={(e) => setDescricaoPreventiva(e.target.value)}
                    placeholder="Descreva o serviço realizado na preventiva..."
                    rows={3}
                    className="w-full resize-none rounded-xl p-3 text-[13.5px] leading-relaxed outline-none"
                    style={inputStyle}
                  />
                </div>
              </div>
            )}
          </div>

          {/* Descrição da atividade — some quando Preventiva está ativa, pois os campos acima já cobrem o relato */}
          {!isPreventiva && (
            <>
              <label className="mb-2 block text-[12px] font-medium" style={{ color: p.textoSecundario }}>
                Descrição da atividade
              </label>
              <textarea
                value={descricao}
                onChange={(e) => setDescricao(e.target.value)}
                placeholder="Descreva a atividade realizada durante o dia que não faz parte da rotina padrão..."
                rows={5}
                className="w-full resize-none rounded-xl p-3 text-[13.5px] leading-relaxed outline-none"
                style={inputStyle}
              />
            </>
          )}

          {/* Fotos */}
          <div className="mt-5">
            <label className="mb-2 block text-[12px] font-medium" style={{ color: p.textoSecundario }}>
              Fotos {fotos.length > 0 ? `(${fotos.length})` : ""}
            </label>

            {fotos.length > 0 && (
              <div className="mb-3 grid grid-cols-3 gap-2">
                {fotos.map((foto) => (
                  <div
                    key={foto.id}
                    className="group relative aspect-square overflow-hidden rounded-xl"
                    style={{ border: `1px solid ${p.borda}` }}
                  >
                    <img src={foto.dataUrl} alt="" className="h-full w-full object-cover" />
                    <button
                      onClick={() => removeFoto(foto.id)}
                      className="absolute right-1 top-1 flex h-6 w-6 items-center justify-center rounded-full"
                      style={{ background: p.overlay, color: p.alerta }}
                    >
                      <Trash2 size={12} />
                    </button>
                  </div>
                ))}
              </div>
            )}

            <div className="flex gap-2">
              <button
                onClick={() => cameraInputRef.current && cameraInputRef.current.click()}
                className="flex flex-1 items-center justify-center gap-2 rounded-xl py-3 text-[13px] font-medium"
                style={{ background: tema.accentSoft2, color: tema.accent, border: `1px dashed ${tema.accentBorder}` }}
              >
                <Camera size={15} />
                {enviandoFoto ? "Carregando..." : "Tirar foto"}
              </button>
              <button
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                className="flex flex-1 items-center justify-center gap-2 rounded-xl py-3 text-[13px] font-medium"
                style={{ background: p.superficieAlt, color: p.textoSecundario, border: `1px dashed ${p.bordaForte}` }}
              >
                <ImageIcon size={15} />
                Anexar
              </button>
            </div>

            <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" multiple className="hidden" onChange={handleFilesSelected} />
            <input ref={fileInputRef} type="file" accept="image/*" multiple className="hidden" onChange={handleFilesSelected} />
          </div>
        </div>
        )}

        {/* Footer fixo */}
        <div className="shrink-0 px-5 pb-5 pt-3" style={{ borderTop: `1px solid ${p.borda}` }}>
          {telaAtual === "lista" ? (
            <button
              onClick={abrirNovaAtividade}
              className="flex w-full items-center justify-center gap-2 rounded-xl py-3.5 text-[14px] font-semibold transition-all active:scale-[0.98]"
              style={{ background: tema.accent, color: "#FFFFFF" }}
            >
              <PlusCircleIcon size={16} strokeWidth={2.4} />
              Nova atividade
            </button>
          ) : (
            <button
              onClick={handleConfirmarClick}
              disabled={!podeConfirmar}
              className="flex w-full items-center justify-center gap-2 rounded-xl py-3.5 text-[14px] font-semibold transition-all active:scale-[0.98]"
              style={{
                background: podeConfirmar ? tema.accent : p.superficieAlt,
                color: podeConfirmar ? "#FFFFFF" : p.textoTerciario,
              }}
            >
              <Check size={16} strokeWidth={2.4} />
              {idEmEdicao ? "Salvar alterações" : "Confirmar atividade"}
            </button>
          )}
        </div>

        {/* Pop-up: divulgar no WhatsApp? */}
        {perguntaWhatsappAberta && (
          <div
            className="absolute inset-0 z-10 flex items-center justify-center p-6"
            style={{ background: p.overlay, backdropFilter: "blur(3px)" }}
          >
            <div
              className="w-full max-w-xs rounded-2xl p-5"
              style={{ background: p.superficie, border: `1px solid ${p.borda}`, boxShadow: p === PALETA.claro ? "0 12px 32px rgba(23,23,23,0.18)" : "none" }}
            >
              <div className="mb-3 flex justify-center">
                <div className="flex h-11 w-11 items-center justify-center rounded-2xl" style={{ background: "rgba(45,196,102,0.14)", color: "#25A855" }}>
                  <Send size={20} />
                </div>
              </div>
              <p className="mb-1 text-center text-[13.5px] font-medium leading-snug" style={{ color: p.texto }}>
                Deseja divulgar essa atividade no WhatsApp?
              </p>
              <p className="mb-4 text-center text-[12px] leading-snug" style={{ color: p.textoTerciario }}>
                Se não, ela será incluída ao final do próximo relatório gerado.
              </p>
              <div className="flex gap-2">
                <button
                  onClick={() => finalizar(false)}
                  className="flex-1 rounded-xl py-2.5 text-[13px] font-medium"
                  style={{ background: p.superficieAlt, color: p.textoSecundario }}
                >
                  Não
                </button>
                <button
                  onClick={() => finalizar(true)}
                  className="flex-1 rounded-xl py-2.5 text-[13px] font-semibold"
                  style={{ background: "#25A855", color: "#FFFFFF" }}
                >
                  Sim
                </button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}


function AreaModal({ area, status, onClose, onToggleItem, onChangeValor, onChangeComentario, onSetAnomalia, onSave, tema, p, fotos, onAddFotos, onRemoveFoto }) {
  const [showComment, setShowComment] = useState(
    status.comentario && status.comentario.trim().length > 0
  );
  const [perguntaAnomaliaAberta, setPerguntaAnomaliaAberta] = useState(false);
  const [justFinished, setJustFinished] = useState(false);
  const textareaRef = useRef(null);
  const fileInputRef = useRef(null);
  const cameraInputRef = useRef(null);
  const minhasFotos = fotos || [];

  const handleFilesSelected = (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    onAddFotos(area.id, files);
    e.target.value = "";
  };

  useEffect(() => {
    if (showComment && textareaRef.current) {
      textareaRef.current.focus();
    }
  }, [showComment]);

  if (!area) return null;
  const Icon = area.icon;
  const valores = status.valores || {};
  const total = area.itens.length;
  const checked = area.itens.filter((item, idx) => itemEstaCompleto(item, idx, status)).length;

  // Classifica os itens da área em três grupos para a nova experiência:
  // 1) texto simples (checklist rotineiro) -> vira 1 clique só
  // 2) estruturado sem "grupo" (equipamento único, ex: Skid de TDI) -> card avulso
  // 3) estruturado com "grupo" (Bombas de Vácuo, Compressores etc.) -> sub-card colapsável
  const itensSimples = [];
  const itensSemGrupo = [];
  const itensPorGrupo = {};
  area.itens.forEach((item, idx) => {
    if (typeof item === "string") {
      itensSimples.push({ texto: item, idx });
    } else if (item.grupo) {
      if (!itensPorGrupo[item.grupo]) itensPorGrupo[item.grupo] = [];
      itensPorGrupo[item.grupo].push({ item, idx });
    } else {
      itensSemGrupo.push({ item, idx });
    }
  });

  const todosSimplesConcluidos = itensSimples.length > 0 && itensSimples.every(({ idx }) => !!status.checkedItems[idx]);

  const handleToggleTodosSimples = () => {
    const novoValor = !todosSimplesConcluidos;
    itensSimples.forEach(({ idx }) => {
      const jaMarcado = !!status.checkedItems[idx];
      if (jaMarcado !== novoValor) onToggleItem(area.id, idx);
    });
  };

  const handleFinish = () => {
    onSave(area.id);
    setJustFinished(true);
    setTimeout(() => {
      setJustFinished(false);
      onClose();
    }, 500);
  };

  return (
    <div
      className="fixed inset-0 z-50 flex flex-col"
      style={{ background: p.overlay, backdropFilter: "blur(4px)" }}
    >
      <div
        className="relative flex flex-col overflow-hidden rounded-3xl"
        style={{
          background: p.superficie,
          border: `1px solid ${p.borda}`,
          boxShadow: p === PALETA.claro ? "0 -8px 40px rgba(23,23,23,0.18)" : "0 -8px 40px rgba(0,0,0,0.45)",
          margin: "auto 12px",
          width: "calc(100% - 24px)",
          maxWidth: "480px",
          maxHeight: "calc(100% - 48px)",
        }}
      >
        {/* Header */}
        <div
          className="flex shrink-0 items-start justify-between gap-3 px-5 pb-4 pt-5"
          style={{ borderBottom: `1px solid ${p.borda}` }}
        >
          <div className="flex items-center gap-3">
            <div
              className="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl"
              style={{ background: tema.accentSoft, color: tema.accent }}
            >
              <Icon size={20} strokeWidth={2} />
            </div>
            <div>
              <div
                className="font-mono text-[11px] font-medium tracking-wider"
                style={{ color: p.textoTerciario }}
              >
                ÁREA {area.id}
              </div>
              <h2 className="text-[17px] font-semibold leading-tight" style={{ color: p.texto }}>{area.nome}</h2>
            </div>
          </div>
          <button
            onClick={onClose}
            className="flex shrink-0 items-center gap-1.5 rounded-full px-3 py-2 transition-colors"
            style={{ background: p.superficieAlt, color: p.textoSecundario }}
          >
            <ChevronLeft size={16} />
            <span className="text-[12.5px] font-medium">Voltar</span>
          </button>
        </div>

        {/* Body scrollable */}
        <div
          className="px-5 py-4"
          style={{
            flex: "1 1 0%",
            minHeight: 0,
            overflowY: "auto",
            WebkitOverflowScrolling: "touch",
            overscrollBehavior: "contain",
          }}
        >
          <div className="mb-4 flex items-center gap-2">
            <div className="h-1.5 flex-1 overflow-hidden rounded-full" style={{ background: p.superficieAlt }}>
              <div
                className="h-full rounded-full transition-all duration-300"
                style={{
                  width: `${total ? (checked / total) * 100 : 0}%`,
                  background: tema.accent,
                }}
              />
            </div>
            <span className="shrink-0 text-[12px] font-medium" style={{ color: p.textoSecundario }}>
              {checked}/{total}
            </span>
          </div>

          {/* Itens de texto simples (checklist rotineiro): 1 clique marca tudo de uma vez */}
          {itensSimples.length > 0 && (
            <button
              onClick={handleToggleTodosSimples}
              className="mb-3 flex w-full items-start gap-3 rounded-xl p-3.5 text-left transition-colors"
              style={{
                background: todosSimplesConcluidos ? p.sucessoSoft : p.superficieAlt,
                border: `1px solid ${todosSimplesConcluidos ? p.sucesso + "40" : p.borda}`,
              }}
            >
              <span
                className="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-md transition-colors"
                style={{
                  background: todosSimplesConcluidos ? p.sucesso : "transparent",
                  border: todosSimplesConcluidos ? "none" : `1.5px solid ${p.bordaForte}`,
                }}
              >
                {todosSimplesConcluidos && <Check size={13} strokeWidth={3} color={p.textoInverso} />}
              </span>
              <div className="flex-1">
                <p
                  className="text-[13.5px] font-medium leading-snug"
                  style={{ color: todosSimplesConcluidos ? p.textoSecundario : p.texto }}
                >
                  Rotina de inspeção visual
                </p>
                <p className="mt-0.5 text-[12px] leading-snug" style={{ color: p.textoTerciario }}>
                  {itensSimples.length === 1 ? itensSimples[0].texto : `${itensSimples.length} verificações — vazamentos, ruídos, fixações e condições gerais`}
                </p>
              </div>
            </button>
          )}

          {/* Itens estruturados sem grupo (equipamento único, ex: Skid de TDI) */}
          {itensSemGrupo.map(({ item, idx }) => (
            <CardEquipamento
              key={idx}
              item={item}
              idx={idx}
              valores={valores}
              onChangeValor={(campoId, v) => onChangeValor(area.id, campoId, v)}
              completo={itemEstaCompleto(item, idx, status)}
              p={p}
            />
          ))}

          {/* Grupos de equipamentos (Bombas de Vácuo, Compressores, etc.) — sub-cards colapsáveis */}
          {Object.entries(itensPorGrupo).map(([grupo, itensDoGrupo]) => (
            <SubCardGrupo
              key={grupo}
              grupo={grupo}
              itensDoGrupo={itensDoGrupo}
              status={status}
              valores={valores}
              area={area}

function MaintenanceApp() {
  const today = useMemo(() => new Date(), []);
  const [tipoRotina, setTipoRotina] = useState("mecanica");
  const rotinaAtual = ROTINAS[tipoRotina];
  const AREAS = rotinaAtual.areas;
  const tema = rotinaAtual.tema;
  const TOTAL_ITENS = useMemo(() => totalItensDe(AREAS), [AREAS]);
  const storageKey = useMemo(() => chaveDoDia(today, tipoRotina), [today, tipoRotina]);

  // ── Tema visual (claro é o padrão; escuro é opcional, salvo no dispositivo) ──
  const [modoTema, setModoTema] = useState(() => {
    const salvo = localStorage.getItem("modo_tema");
    return salvo === "escuro" ? "escuro" : "claro";
  });
  const p = PALETA[modoTema];
  useEffect(() => {
    localStorage.setItem("modo_tema", modoTema);
  }, [modoTema]);

  // ── Navegação ─────────────────────────────────────────────────────────────
  const [pagina, setPagina] = useState("checklist"); // checklist | perfil | dashboard
  const [menuAberto, setMenuAberto] = useState(false);
  const [usuarioEditando, setUsuarioEditando] = useState(null);
  const [dashboardRefreshKey, setDashboardRefreshKey] = useState(0);
  const [usuario, setUsuario] = useState(() => {
    return JSON.parse(localStorage.getItem("usuario_sessao") || "null");
  });

  // Versão do schema de cadastro: subimos esse número sempre que exigirmos que
  // TODOS os usuários recadastrem (ex: novos campos obrigatórios como login/email).
  // Um usuário com sessão salva de versão anterior é deslogado uma única vez,
  // com aviso cordial, mesmo que a sessão dele ainda "funcione" tecnicamente.
  const VERSAO_CADASTRO_ATUAL = 2;

  // Detecta sessão "órfã" (usuário não existe mais no banco) OU sessão de versão
  // de cadastro antiga (precisa preencher campos novos). Em ambos os casos,
  // desloga e sinaliza recadastro com aviso cordial, em vez de tela de login padrão.
  const [precisaRecadastrar, setPrecisaRecadastrar] = useState(false);
  useEffect(() => {
    const versaoSalva = parseInt(localStorage.getItem("versao_cadastro") || "0", 10);
    if (!usuario) {
      // Sem sessão nenhuma: só marca a versão atual para não pedir recadastro de novo à toa
      localStorage.setItem("versao_cadastro", String(VERSAO_CADASTRO_ATUAL));
      return;
    }
    if (versaoSalva < VERSAO_CADASTRO_ATUAL) {
      localStorage.removeItem("usuario_sessao");
      localStorage.setItem("versao_cadastro", String(VERSAO_CADASTRO_ATUAL));
      setUsuario(null);
      setPrecisaRecadastrar(true);
      return;
    }
    if (!usuario.id) return;
    let cancelado = false;
    supaVerificarUsuarioExiste(usuario.id).then((existe) => {
      if (!existe && !cancelado) {
        localStorage.removeItem("usuario_sessao");
        setUsuario(null);
        setPrecisaRecadastrar(true);
      }
    });
    return () => { cancelado = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const saudacao = useMemo(() => {
    const h = today.getHours();
    if (h < 12) return "Bom dia";
    if (h < 18) return "Boa tarde";
    return "Boa noite";
  }, [today]);

  // Resumo do dia anterior — lê do localStorage pelo par de rotinas
  const resumoDiaAnterior = useMemo(() => {
    const ontem = new Date(today);
    ontem.setDate(ontem.getDate() - 1);
    const yyyy = ontem.getFullYear();
    const mm = String(ontem.getMonth() + 1).padStart(2, "0");
    const dd = String(ontem.getDate()).padStart(2, "0");
    const resumo = {};
    ["mecanica", "eletrica"].forEach((tipo) => {
      const chave = `rotina:${tipo}:${yyyy}-${mm}-${dd}`;
      try {
        const raw = localStorage.getItem(chave);
        if (!raw) return;
        const dados = JSON.parse(raw);
        const areas = tipo === "mecanica" ? AREAS_MECANICA : AREAS_ELETRICA;
        const total = totalItensDe(areas);
        const concluidos = areas.reduce((acc, a) => {
          const s = dados[a.id];
          if (!s) return acc;
          return acc + a.itens.filter((item, idx) => itemEstaCompleto(item, idx, s)).length;
        }, 0);
        resumo[tipo] = { concluidos, total, percentual: total ? Math.round((concluidos / total) * 100) : 0 };
      } catch (_) {}
    });
    return resumo;
  }, [today]);

  const [status, setStatus] = useState(() => estadoInicial(AREAS));
  const [openAreaId, setOpenAreaId] = useState(null);
  const [reportOpen, setReportOpen] = useState(false);
  const [resumoIaOpen, setResumoIaOpen] = useState(false);
  const [resumoIaTexto, setResumoIaTexto] = useState(null);
  const [resumoIaCarregando, setResumoIaCarregando] = useState(false);
  const [resumoIaErro, setResumoIaErro] = useState(null);
  const [resumoIaAvisoTruncado, setResumoIaAvisoTruncado] = useState(false);
  const [photoReportOpen, setPhotoReportOpen] = useState(false);
  const [reportOntemOpen, setReportOntemOpen] = useState(false);
  const [reportTextOntem, setReportTextOntem] = useState(null);
  const [carregandoOntem, setCarregandoOntem] = useState(false);

  // Busca registros de ontem do Supabase (todos os usuários) quando o app carrega
  useEffect(() => {
    const ontem = new Date(today);
    ontem.setDate(ontem.getDate() - 1);
    const yyyy = ontem.getFullYear();
    const mm = String(ontem.getMonth() + 1).padStart(2, "0");
    const dd = String(ontem.getDate()).padStart(2, "0");
    const dataISO = `${yyyy}-${mm}-${dd}`;

    async function buscarOntem() {
      setCarregandoOntem(true);
      try {
        const registros = await supaGetRegistrosDia(dataISO);
        if (!registros || registros.length === 0) { setReportTextOntem(null); setCarregandoOntem(false); return; }

        // Agrupa por usuário → rotina → áreas
        const porUsuario = {};
        registros.forEach((r) => {
          const chave = r.usuario_nome;
          if (!porUsuario[chave]) porUsuario[chave] = {};
          if (!porUsuario[chave][r.tipo_rotina]) porUsuario[chave][r.tipo_rotina] = [];
          porUsuario[chave][r.tipo_rotina].push(r);
        });

        const linhas = [];
        linhas.push(`RESUMO DO DIA ANTERIOR — ${formatarDataLonga(ontem).toUpperCase()}`);
        linhas.push("");

        Object.entries(porUsuario).forEach(([nomeUsuario, rotinas], uIdx) => {
          if (uIdx > 0) linhas.push("");
          linhas.push(`👤 *${nomeUsuario}*`);

          Object.entries(rotinas).forEach(([rotina, areas]) => {
            const labelRotina = rotina === "mecanica" ? "Mecânica" : rotina === "eletrica" ? "Elétrica" : "Start up";
            const totalItens = areas.reduce((acc, r) => acc + (r.checked_items ? r.checked_items.length : 0), 0);
            const checkedItens = areas.reduce((acc, r) => acc + (r.checked_items ? r.checked_items.filter(Boolean).length : 0), 0);

            linhas.push(`  *${labelRotina}*: "${checkedItens}/${totalItens}"`);

            areas.forEach((r) => {
              // Valores estruturados (queimadores, bombas, etc.)
              const valores = r.valores || {};
              const valoresFmt = Object.entries(valores)
                .filter(([, v]) => v && v.toString().trim())
                .map(([k, v]) => `${k}: ${v}`)
                .join(", ");
              if (valoresFmt) linhas.push(`  > ${r.area_nome}: ${valoresFmt}`);
              if (r.comentario && r.comentario.trim()) linhas.push(`  > ${r.area_nome}: ${r.comentario.trim()}`);

      }).join("\n");

      const prompt = `Você vai transformar o relatório bruto de uma rotina de manutenção industrial em uma versão curta e objetiva para WhatsApp, seguindo EXATAMENTE esta estrutura, nesta ordem:

Relatório diário de manutenção
${nomeUsuario}

Áreas verificadas:
(uma linha por área, no formato "Nome da área: x/y", reproduzindo exatamente os números abaixo — não recalcule)
${areasComProgresso}

Observações e anomalias:
(texto corrido curto e objetivo — 1 a 3 frases citando especificamente qualquer observação, comentário ou valor fora do padrão presente no relatório bruto: equipamento parado ou em manutenção, temperatura/pressão fora do esperado, vazamento, atividade não rotineira registrada, etc. Se não houver nada digno de nota, escreva apenas: "Nenhuma anomalia identificada.")

Equipamentos verificados:
(uma linha por equipamento que tenha dado numérico ou status registrado no relatório bruto, no formato "→ Nome do equipamento: dado1, dado2". Use exatamente os valores do relatório bruto, sem inventar nada. Se nenhum equipamento tiver dado registrado, omita esta seção inteira, incluindo o título.)

Regras estritas:
- Cabeçalho de "Relatório diário de manutenção" até a lista de áreas deve ser enxuto, sem frases de introdução.
- Não use markdown (sem **negrito**, sem #), não use emojis.
- Cada linha de equipamento DEVE começar com "→ " (seta e espaço), nunca com "-", "*" ou "•".
- Sua resposta deve conter SOMENTE o texto final pronto para copiar e colar — nada de comentários sobre como você seguiu as instruções, nada de explicações extras.

Relatório bruto (fonte de todos os dados, incluindo observações e valores de equipamentos):
${reportText}`;

      const response = await fetch(`${SUPA_URL}/functions/v1/resumo-ia`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPA_KEY,
          "Authorization": `Bearer ${SUPA_KEY}`,
        },
        body: JSON.stringify({ prompt }),
      });

      const data = await response.json();
      if (!response.ok || data.error) {
        throw new Error(data.error || `Erro na função (${response.status})`);
      }
      if (!data.texto) throw new Error("Resposta vazia da IA");

      // Limpeza defensiva: remove qualquer resíduo de "raciocínio exposto"
      // que o modelo às vezes devolve antes do texto final (linhas de checklist,
      // markdown de lista, texto entre asteriscos usado como ênfase de regra).
      const limpo = data.texto
        .split("\n")
        .filter((linha) => {
          const l = linha.trim();
          if (!l) return true; // mantém linhas em branco (separam parágrafos)
          if (/^[\*\-•]/.test(l)) return false; // linha de lista/bullet
          if (/^(NO|SIM|YES|OK)\b.*\?/i.test(l)) return false; // linha tipo "NO bullets? Yes."
          return true;

        .join("\n")
        .trim();

      if (data.truncado) {
        setResumoIaAvisoTruncado(true);
      }

      const msg = e && e.message ? e.message : "";
      if (msg.includes("503") || msg.toLowerCase().includes("overloaded") || msg.toLowerCase().includes("high demand")) {

      } else {
        setResumoIaErro(msg || "Falha ao gerar resumo. Tente novamente.");
      }
    }
    setResumoIaCarregando(false);

    <p>${totalFotos} foto(s) em ${areasComFoto.length} área(s)</p>
  </header>
  ${blocos || '<p>Nenhuma foto anexada ainda.</p>'}
</body>
</html>`;

    win.document.open();
    win.document.write(html);
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 400);
  }

  function handleSendWhatsapp() {
    const encoded = encodeURIComponent(reportText);
    const base = telefone.trim()
      ? `https://wa.me/55${telefone.replace(/\D/g, "")}`
      : `https://wa.me/`;
    const url = `${base}?text=${encoded}`;
    window.open(url, "_blank");
  }

  if (!isReady) {
    return (
      <div
        className="flex min-h-full w-full items-center justify-center"
        style={{ background: p.fundo }}
      >
        <div className="flex flex-col items-center gap-3">
          <div
            className="h-8 w-8 animate-spin rounded-full"
            style={{
              border: `3px solid ${tema.accentRgbLow}`,
              borderTopColor: tema.accent,
            }}
          />
          <span className="text-[13px]" style={{ color: p.textoTerciario }}>
            Carregando rotina de hoje...
          </span>
        </div>
      </div>
    );
  }

  return (
    <div
      className="relative min-h-full w-full"
      style={{ background: p.fundo, fontFamily: "'Inter', -apple-system, sans-serif" }}
    >
      {/* Modal de login */}
      {!usuario && <LoginModal onLogin={(u) => setUsuario(u)} p={p} tema={tema} precisaRecadastrar={precisaRecadastrar} />}

      {/* Menu lateral */}
      <MenuLateral
        aberto={menuAberto}
        onFechar={() => setMenuAberto(false)}
        paginaAtual={pagina}
        onNavegar={setPagina}
        usuario={usuario}
        tema={tema}
        p={p}
        onSair={() => {
          localStorage.removeItem("usuario_sessao");
          setUsuario(null);
          setPagina("checklist");
        }}
      />

      {/* Textura sutil de fundo */}
      <div
        className="pointer-events-none fixed inset-0 opacity-[0.55] transition-opacity duration-300"
        style={{
          backgroundImage: modoTema === "claro"
            ? `radial-gradient(circle at 12% -5%, ${tema.accentSoft}, transparent 45%), radial-gradient(circle at 90% 15%, ${tema.accentSoft2}, transparent 35%)`
            : `radial-gradient(circle at 15% 0%, ${tema.accentSoft2}, transparent 40%), radial-gradient(circle at 85% 100%, rgba(61,220,132,0.06), transparent 40%)`,
        }}
      />

      <div className="relative mx-auto flex max-w-md flex-col px-4 pb-40 pt-6">
        {/* Seletor de rotina */}
        <div
          className="mb-4 flex rounded-2xl p-1"
          style={{ background: p.superficie, border: `1px solid ${p.borda}` }}
        >
          {Object.entries(ROTINAS).map(([key, r]) => {
            const ativo = key === tipoRotina;
            const Icon = key === "mecanica" ? Wrench : key === "eletrica" ? Zap : Send;
            return (
              <button
                key={key}
                onClick={() => setTipoRotina(key)}
                className="flex flex-1 items-center justify-center gap-2 rounded-xl py-2.5 text-[13px] font-semibold transition-all duration-200"
                style={{
                  background: ativo ? r.tema.gradient : "transparent",
                  color: ativo ? "#FFFFFF" : p.textoTerciario,
                }}
              >
                <Icon size={15} strokeWidth={2.3} />
                {r.label}
              </button>
            );
          })}
        </div>

        {/* Header */}
        <div className="mb-5 flex items-center justify-between">
          <div className="flex items-center gap-3">
            {/* Botão hambúrguer */}
            <button
              onClick={() => setMenuAberto(true)}
              className="flex h-9 w-9 flex-col items-center justify-center gap-1.5 rounded-xl"
              style={{ background: p.superficie, border: `1px solid ${p.borda}` }}
            >
              {[0,1,2].map((i) => (
                <span key={i} className="block h-0.5 w-4 rounded-full" style={{ background: p.textoSecundario }} />
              ))}
            </button>
            <div>
              <div
                className="font-mono text-[11px] font-medium uppercase tracking-wider transition-colors duration-300"
                style={{ color: tema.accent }}
              >
                {pagina === "checklist" ? `Rotina — ${rotinaAtual.label}` : pagina === "perfil" ? "Meu perfil" : "Dashboard"}
              </div>
              <h1 className="text-[18px] font-bold leading-tight" style={{ color: p.texto }}>
                {pagina === "checklist"
                  ? (usuario ? `${saudacao}, ${usuario.nome}!` : "Checklist")
                  : pagina === "perfil" ? (usuario ? usuario.nome + " " + usuario.sobrenome : "Perfil")
                  : "Métricas gerais"}
              </h1>
              <p className="mt-0.5 text-[12px]" style={{ color: p.textoTerciario }}>
                {formatarDataLonga(today)}
              </p>
            </div>
          </div>

          {/* Avatar no topo direito */}
          <button
            onClick={() => setPagina("perfil")}
            className="flex h-10 w-10 shrink-0 items-center justify-center overflow-hidden rounded-2xl"
            style={{ background: tema.accentSoft, border: `1.5px solid ${tema.accentBorder}` }}
          >
            {usuario && usuario.foto_url
              ? <img src={usuario.foto_url} alt="" className="h-full w-full object-cover" />
              : <span className="text-[15px] font-bold" style={{ color: tema.accent }}>
                  {(usuario && usuario.nome ? usuario.nome[0].toUpperCase() : "?") || "?"}
                </span>
            }
          </button>
        </div>

        {/* Resumo do dia anterior (só no checklist) */}
        {pagina === "checklist" && (resumoDiaAnterior.mecanica || resumoDiaAnterior.eletrica) && (
          <div
            className="mb-4 rounded-xl px-3 py-2"
            style={{ background: p.superficie, border: `1px solid ${p.borda}` }}
          >
            <p className="mb-1 text-[10px] font-medium uppercase tracking-wide" style={{ color: p.textoTerciario }}>Ontem</p>
            <div className="flex flex-col gap-0.5">
              {resumoDiaAnterior.mecanica && (
                <p className="text-[12px]" style={{ color: p.textoSecundario }}>
                  <span style={{ color: TEMAS.mecanica.accent }}>Mecânica</span>{" "}
                  — {resumoDiaAnterior.mecanica.concluidos}/{resumoDiaAnterior.mecanica.total} itens ({resumoDiaAnterior.mecanica.percentual}%)
                </p>
              )}
              {resumoDiaAnterior.eletrica && (
                <p className="text-[12px]" style={{ color: p.textoSecundario }}>
                  <span style={{ color: TEMAS.eletrica.accent }}>Elétrica</span>{" "}
                  — {resumoDiaAnterior.eletrica.concluidos}/{resumoDiaAnterior.eletrica.total} itens ({resumoDiaAnterior.eletrica.percentual}%)
                </p>
              )}
            </div>
          </div>
        )}

        {loadError && pagina === "checklist" && (
          <p className="mb-3 text-[11px] font-medium" style={{ color: p.alerta }}>
            ⚠ Não foi possível carregar o progresso ({loadError}).
          </p>
        )}

        {pagina === "checklist" && usuario && !usuario.id && (
          <div className="mb-3 rounded-xl px-3 py-2" style={{ background: p.alertaSoft, border: `1px solid ${p.alerta}40` }}>
            <p className="text-[11.5px] font-medium" style={{ color: p.alerta }}>
              ⚠ Seu progresso está salvo só neste celular — não aparecerá no Dashboard nem para outros usuários. Saia e entre novamente para sincronizar com a nuvem.
            </p>
          </div>
        )}

        {syncError && pagina === "checklist" && (
          <p className="mb-3 text-[11px] font-medium" style={{ color: p.alerta }}>
            ⚠ Falha ao sincronizar com o servidor ({syncError}). Seus dados estão salvos localmente.
          </p>
        )}

        {/* Telas */}
        {pagina === "perfil" && (
          <TelaPerfil
            usuario={usuario}
            onAtualizarUsuario={setUsuario}
            tema={tema}
            p={p}
            modoTema={modoTema}
            onMudarModoTema={setModoTema}
          />
        )}
        {pagina === "dashboard" && (
          <TelaDashboard
            tema={tema}
            today={today}
            usuario={usuario}
            onEditarUsuario={(u) => setUsuarioEditando(u)}
            refreshKey={dashboardRefreshKey}
            p={p}
          />
        )}
        {usuarioEditando && (
          <ModalEditarUsuario
            usuarioAlvo={usuarioEditando}
            onClose={() => setUsuarioEditando(null)}
            onSalvo={(atualizado) => {
              setUsuarioEditando(null);
              // Se o admin editou o próprio usuário, atualiza a sessão local também
              if (usuario && usuario.id === atualizado.id) {
                const novoUsuario = { ...usuario, nome: atualizado.nome, sobrenome: atualizado.sobrenome, foto_url: atualizado.foto_url };
                localStorage.setItem("usuario_sessao", JSON.stringify(novoUsuario));
                setUsuario(novoUsuario);
              }
              setDashboardRefreshKey((k) => k + 1);
            }}
            tema={tema}
            p={p}
          />
        )}
        {pagina === "checklist" && (<>
          {/* Indicador de save + botão reiniciar */}
          <div className="mb-2 flex items-center justify-between">
            <span
              className="flex items-center gap-1.5 text-[10.5px] font-medium"
              style={{
                color: saveState === "error" ? p.alerta : saveState === "saving" ? p.textoTerciario : saveState === "saved" ? p.sucesso : p.textoTerciario,
              }}
            >
              <span className="h-1.5 w-1.5 rounded-full" style={{ background: saveState === "error" ? "#E24B4A" : saveState === "saving" ? p.textoTerciario : saveState === "saved" ? p.sucesso : p.textoTerciario }} />
              {saveState === "error" ? "Falha ao salvar" : saveState === "saving" ? "Salvando..." : saveState === "saved" ? "Progresso salvo" : "Pronto"}
            </span>
            <button onClick={() => setResetConfirm(true)} className="text-[10.5px] font-medium underline" style={{ color: p.textoTerciario }}>
              Reiniciar rotina
            </button>
          </div>

          {/* Painel de progresso geral */}
          <div
            className="mb-5 flex items-center gap-4 rounded-2xl p-4"
            style={{ background: p.superficie, border: `1px solid ${p.borda}`, boxShadow: p === PALETA.claro ? "0 2px 8px rgba(23,23,23,0.06)" : "none" }}
          >
            <ProgressRing progress={overallProgress} size={56} stroke={5} color={tema.accent} track={p === PALETA.claro ? "rgba(23,23,23,0.08)" : "rgba(255,255,255,0.08)"} />
            <div className="flex-1">
              <div className="text-[18px] font-bold" style={{ color: p.texto }}>
                {totalChecked}/{TOTAL_ITENS}
                <span className="ml-1.5 text-[12px] font-normal" style={{ color: p.textoTerciario }}>itens verificados</span>
              </div>
              <div className="mt-1 flex gap-3 text-[11.5px]" style={{ color: p.textoSecundario }}>
                <span className="flex items-center gap-1"><CheckCircle2 size={12} style={{ color: p.sucesso }} />{areasSalvas} áreas concluídas</span>
                <span className="flex items-center gap-1"><MessageSquarePlus size={12} style={{ color: tema.accent }} />{areasComObservacao} c/ observações</span>
              </div>
            </div>
          </div>

        {/* Grid de áreas */}
        {AREAS.length === 0 ? (
          <div
            className="flex flex-col items-center gap-3 rounded-2xl px-6 py-12 text-center"
            style={{ background: p.superficie, border: `1px dashed ${p.bordaForte}` }}
          >
            <div
              className="flex h-12 w-12 items-center justify-center rounded-2xl"
              style={{ background: tema.accentSoft, color: tema.accent }}
            >
              <Send size={22} strokeWidth={2} />
            </div>
            <div>
              <h3 className="mb-1 text-[15px] font-semibold" style={{ color: p.texto }}>Checklist em construção</h3>
              <p className="text-[13px]" style={{ color: p.textoSecundario }}>
                A rotina de Start up ainda não tem itens cadastrados. Em breve.
              </p>
            </div>
          </div>
        ) : (
          <div className="grid grid-cols-2 gap-3">
            {AREAS.map((area) => (
              <AreaCard
                key={area.id}
                area={area}
                status={status[area.id]}
                onOpen={setOpenAreaId}
                tema={tema}
                p={p}
                fotoCount={(fotosPorArea[area.id] || []).length}
              />
            ))}
          </div>
        )}
        </>)}
      </div>

      {/* Botões flutuantes — só no checklist */}
      {pagina === "checklist" && (
      <div className="fixed inset-x-0 bottom-0 z-40 mx-auto flex max-w-md flex-col gap-2 px-4 pb-5">

        <div className="flex gap-2">
          <button
            onClick={() => setReportOpen(true)}
            className="flex flex-1 items-center justify-center gap-2 rounded-2xl py-4 text-[14px] font-semibold shadow-2xl transition-all active:scale-[0.98] duration-300"
            style={{
              background: tema.gradient,
              color: "#FFFFFF",
              boxShadow: `0 8px 30px ${tema.glow}`,
            }}
          >
            <FileText size={18} strokeWidth={2.3} />
            Relatório de texto
          </button>

          <button
            onClick={gerarResumoIA}
            className="flex h-[52px] w-[52px] shrink-0 items-center justify-center rounded-2xl shadow-lg transition-all active:scale-[0.98]"
            style={{
              background: "rgba(45,212,191,0.1)",
              color: "#1F9A8A",
              border: "1px solid rgba(45,212,191,0.35)",
            }}
            title="Relatório IA"
          >
            <Zap size={20} strokeWidth={2.3} />
          </button>

          <button
            onClick={abrirRelatorioFotos}
            disabled={totalFotos === 0}
            className="relative flex h-[52px] w-[52px] shrink-0 items-center justify-center rounded-2xl shadow-2xl transition-all active:scale-[0.98] duration-300"
            style={{
              background: totalFotos === 0 ? p.superficieAlt : p.superficie,
              color: totalFotos === 0 ? p.textoTerciario : p.texto,
              border: `1px solid ${p.bordaForte}`,
            }}
            title="Relatório de fotos"
          >
            <ImageIcon size={20} strokeWidth={2.3} />
            {totalFotos > 0 && (
              <span
                className="absolute -right-1.5 -top-1.5 flex h-5 min-w-5 items-center justify-center rounded-full px-1 text-[10.5px] font-bold"
                style={{ background: tema.accent, color: "#FFFFFF" }}
              >
                {totalFotos}
              </span>
            )}
          </button>
        </div>

        {/* Botão "Ontem" — aparece sempre (carregando ou com dados) */}
        {(carregandoOntem || reportTextOntem) && (
          <button
            onClick={() => !carregandoOntem && setReportOntemOpen(true)}
            disabled={carregandoOntem}
            className="flex w-full items-center justify-center gap-2 rounded-2xl py-3 text-[13px] font-medium shadow-lg transition-all active:scale-[0.98]"
            style={{
              background: p.superficie,
              color: carregandoOntem ? p.textoTerciario : p.textoSecundario,
              border: `1px solid ${p.borda}`,
            }}
          >
            <Circle size={13} strokeWidth={2} />
            {carregandoOntem ? "Buscando relatório de ontem..." : "Ver relatório de ontem (todos os usuários)"}
          </button>
        )}
      </div>
      )}

      {/* Botão flutuante (FAB) — Adicionar Atividade não Rotineira */}
      {pagina === "checklist" && !algumModalAberto && (
        <>
          {/* Overlay invisível: toque fora recolhe o FAB sem abrir o modal */}
          {fabAtividadeExpandido && (
            <div
              className="fixed inset-0 z-40"
              onClick={() => setFabAtividadeExpandido(false)}
            />
          )}
          <button
            onClick={() => {
              if (fabAtividadeExpandido) {
                setAtividadeModalOpen(true);
                setFabAtividadeExpandido(false);
              } else {
                setFabAtividadeExpandido(true);
              }
            }}
            className="fixed z-50 flex items-center gap-2 overflow-hidden rounded-full shadow-2xl transition-all duration-300 ease-out active:scale-[0.96]"
            style={{
              right: "16px",
              bottom: "168px",
              height: "56px",
              width: fabAtividadeExpandido ? "auto" : "56px",
              paddingLeft: fabAtividadeExpandido ? "20px" : "0",
              paddingRight: fabAtividadeExpandido ? "22px" : "0",
              background: "linear-gradient(135deg, #D97706, #B45309)",
              boxShadow: "0 10px 28px rgba(217,119,6,0.45)",
            }}
          >
            <span className="flex h-full shrink-0 items-center justify-center" style={{ width: "56px", marginLeft: fabAtividadeExpandido ? "-20px" : "0" }}>
              <PlusCircleIcon size={24} strokeWidth={2.3} color="#FFFFFF" />
            </span>
            <span
              className="whitespace-nowrap text-[14px] font-semibold text-white transition-opacity duration-200"
              style={{ opacity: fabAtividadeExpandido ? 1 : 0, display: fabAtividadeExpandido ? "inline" : "none" }}
            >
              Adicionar Atividade não Rotineira
            </span>
          </button>
          {atividadesNaoRotineiras.length > 0 && !fabAtividadeExpandido && (
            <span
              className="fixed flex h-6 min-w-6 items-center justify-center rounded-full px-1.5 text-[12px] font-bold text-white"
              style={{
                right: "12px",
                bottom: "212px",
                zIndex: 60,
                background: "#DC2626",
                boxShadow: "0 2px 6px rgba(220,38,38,0.5)",
                border: `2px solid ${p.fundo}`,
                pointerEvents: "none",
              }}
            >
              {atividadesNaoRotineiras.length}
            </span>
          )}
        </>
      )}

      {/* Modais */}
      {openArea && status[openArea.id] && (
        <AreaModal
          area={openArea}
          status={status[openArea.id]}
          onClose={() => setOpenAreaId(null)}
          onToggleItem={toggleItem}
          onChangeValor={changeValor}
          onChangeComentario={changeComentario}
          onSetAnomalia={changeAnomalia}
          onSave={saveArea}
          tema={tema}
          p={p}
          fotos={fotosPorArea[openArea.id]}
          onAddFotos={addFotos}
          onRemoveFoto={removeFoto}
        />
      )}

      <ReportModal
        open={reportOpen}
        onClose={() => setReportOpen(false)}
        reportText={reportText}
        onSendWhatsapp={handleSendWhatsapp}
        telefone={telefone}
        setTelefone={setTelefone}
        p={p}
      />

      {/* Modal relatório do dia anterior */}
      {reportOntemOpen && reportTextOntem && (
        <ReportModal
          open={reportOntemOpen}
          onClose={() => setReportOntemOpen(false)}
          reportText={reportTextOntem}
          onSendWhatsapp={() => {
            const encoded = encodeURIComponent(reportTextOntem);
            const url = telefone
              ? `https://wa.me/55${telefone.replace(/\D/g, "")}?text=${encoded}`
              : `https://wa.me/?text=${encoded}`;
            window.open(url, "_blank");
          }}
          telefone={telefone}
          setTelefone={setTelefone}
          p={p}
        />
      )}

      {/* Modal resumo com IA */}
      <ResumoIaModal
        open={resumoIaOpen}
        onClose={() => setResumoIaOpen(false)}
        carregando={resumoIaCarregando}
        erro={resumoIaErro}
        texto={resumoIaTexto}
        onTentarNovamente={gerarResumoIA}
        telefone={telefone}
        setTelefone={setTelefone}
        avisoTruncado={resumoIaAvisoTruncado}
        p={p}
      />

      {/* Modal de atividade não rotineira */}
      {atividadeModalOpen && (
        <ModalAtividadeNaoRotineira
          onClose={() => setAtividadeModalOpen(false)}
          onConfirmar={handleConfirmarAtividade}
          tema={tema}
          p={p}
          usuario={usuario}
          atividades={atividadesNaoRotineiras}
        />
      )}

      {resetConfirm && (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center px-6"
          style={{ background: p.overlay, backdropFilter: "blur(4px)" }}
          onClick={() => setResetConfirm(false)}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="w-full max-w-sm rounded-2xl p-5"
            style={{ background: p.superficie, border: `1px solid ${p.borda}`, boxShadow: p === PALETA.claro ? "0 16px 48px rgba(23,23,23,0.2)" : "none" }}
          >
            <div className="mb-3 flex items-center gap-2.5">
              <div
                className="flex h-9 w-9 items-center justify-center rounded-xl"
                style={{ background: p.alertaSoft, color: "#E24B4A" }}
              >
                <AlertTriangle size={17} />
              </div>
              <h3 className="text-[15px] font-semibold" style={{ color: p.texto }}>
                Reiniciar rotina {rotinaAtual.label.toLowerCase()} de hoje?
              </h3>
            </div>
            <p className="mb-4 text-[13px] leading-relaxed" style={{ color: p.textoSecundario }}>
              Todos os itens marcados e observações de hoje na rotina <strong>{rotinaAtual.label.toLowerCase()}</strong> serão apagados. A outra rotina não é afetada. Essa ação não pode ser desfeita.
            </p>
            <div className="flex gap-2">
              <button
                onClick={() => setResetConfirm(false)}
                className="flex-1 rounded-xl py-2.5 text-[13px] font-medium"
                style={{ background: p.superficieAlt, color: p.textoSecundario }}
              >
                Cancelar
              </button>
              <button
                onClick={() => {
                  resetarRotina();
                  setResetConfirm(false);
                }}
                className="flex-1 rounded-xl py-2.5 text-[13px] font-semibold"
                style={{ background: "#E24B4A", color: "white" }}
              >
                Reiniciar
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

</script>
<script type="text/babel" data-presets="react,env">
ReactDOM.createRoot(document.getElementById("root")).render(<MaintenanceApp />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then((reg) => {
        // Força checagem imediata de atualização do Service Worker
        reg.update();

        // Quando um novo Service Worker assume o controle, a versão em cache
        // mudou — recarrega a página automaticamente para que o usuário veja
        // o conteúdo novo sem precisar fazer nada manualmente.
        let jaRecarregou = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (jaRecarregou) return;
          jaRecarregou = true;
          window.location.reload();
        });
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
